findings:
  - id: FIND-DEV-CANCEL-CONTRACT-001
    title: "部分驱动的查询取消只取消本地 context，底层 SQL 仍会继续阻塞"
    type: 调用链/契约缺陷
    severity: P1
    confidence: 高
    affected_capabilities: [CAP-CONN-A12, CAP-QUERY-A12, CAP-MCP-A04]
    affected_symbols: ["internal/app.(*App).DBQueryWithCancel", "internal/db.Database.Query", "internal/db.Database.Exec"]
    contract_boundary: "DBQueryWithCancel 与 Database 基础接口之间的取消能力契约"
    conclusion: "DBQueryWithCancel 在驱动未实现 QueryContext/ExecContext 时回退到无 context 的 Query/Exec；运行中止只取消注册的 context，不能中断底层调用。"
    evidence:
      - "internal/app/methods_db.go:1236-1245: runReadQuery 检测不到 QueryContext 后调用 inst.Query(query)"
      - "internal/app/methods_db.go:1258-1266: runExecQuery 检测不到 ExecContext 后调用 inst.Exec(query)"
      - "internal/app/methods_db.go:1218-1223: 运行查询登记与取消只作用于 context"
      - "internal/db/database.go:基础 Database 接口未强制要求 Context 变体"
    impact: "用户点击取消、请求超时或 MCP 客户端断开后，长查询仍占用连接和服务端资源，可能造成连接池耗尽；前端可能显示已取消而实际工作仍在执行。"
    recommendation: "把取消能力声明为数据源 capability；支持取消的驱动必须走 Context API，不支持的驱动要在入口和 UI/MCP 明确标记不可取消，或使用可关闭的专用连接/driver-agent 取消通道。"
    acceptance_criteria:
      - "支持 context 的驱动在取消或 deadline 后于限定时间内返回"
      - "不支持 context 的驱动不会伪报已停止，并返回结构化能力边界"
      - "覆盖 DBQuery、DBQueryMulti、MCP/Web 请求断开和 driver-agent 回退测试"
    verification_status: 代码证据确认
    verification_path: "构造仅实现 Query/Exec 的阻塞 fake Database，调用 DBQueryWithCancel 后触发取消，断言底层调用仍阻塞时 API 不声称已停止；再用 Context fake 验证限定时间内返回。"
    verification_boundary: "真实驱动、桌面 UI 和远端 MCP 尚未验证。"
    reproduction:
      preconditions: ["仅实现 Query/Exec 的阻塞 fake Database"]
      steps: ["调用 DBQueryWithCancel", "触发取消", "观察 API 状态和底层调用"]
      expected: "底层调用停止，或明确返回不可取消能力边界。"
      actual: "无 Context 驱动仍继续阻塞。"
    root_cause: "检测不到 Context 变体时，应用层回退到无 Context 的 Query/Exec。"
    regression_risk: "共享 Database 接口和 Driver Agent 查询入口可能受影响。"
    fix_boundary:
      allowed_paths: ["internal/app/methods_db.go", "internal/db/database.go", "相关驱动和取消测试"]
      preserve: ["支持 Context 驱动的取消行为", "普通 DBQuery 兼容性"]
      out_of_scope: ["无关 SQL 解析器重构"]
    regression_tests: ["阻塞 fake driver 取消", "Context fake driver 取消", "DBQueryMulti/MCP 断开"]
    verification_commands: ["go test ./internal/app -run 'Query.*Cancel|RunningQuery' -count=1"]
    issue:
      title: "[开发][P1] 无 Context 驱动的查询取消不会停止底层 SQL"
      labels: [bug, developer, query, ai-ready]
      operation: query
      data_state: test_fixture
      server_side_effect: none
      security_constraints: ["不输出凭据", "不连接生产数据库"]

  - id: FIND-DEV-OBJECT-PARTIAL-001
    title: "对象元数据查询失败会被静默吞掉并返回完整成功"
    type: 功能缺陷
    severity: P1
    confidence: 高
    affected_capabilities: [CAP-EXP-001, CAP-QUERY-A05, CAP-MCP-A02]
    affected_symbols: ["internal/app.(*App).DBGetObjects", "internal/app.listObjectsByQueries", "frontend/src/components/sidebar/useSidebarTreeLoaders.tsx"]
    contract_boundary: "DBGetObjects 的 QueryResult 成功语义与对象元数据部分失败状态"
    conclusion: "DBGetObjects 在基础表、视图、触发器、例程等任一元数据查询失败时仅记录日志或 continue，最终仍返回 Success:true；调用方无法区分空对象与权限/方言失败导致的部分结果。"
    evidence:
      - "internal/app/methods_db_objects.go:42-46: GetTables 失败仅 Warn 后继续"
      - "internal/app/methods_db_objects.go:95-101: listObjectsByQueries 对查询错误直接 continue"
      - "internal/app/methods_db_objects.go:52-59: 无 partial/warnings 字段仍返回 Success:true"
      - "frontend/src/components/sidebar/useSidebarTreeLoaders.tsx:对象树直接消费返回结果"
    impact: "侧栏对象树、SQL 补全、结构设计和 MCP 工具可能静默漏掉视图/触发器/例程；用户会误以为对象不存在，权限变化也无法定位。"
    recommendation: "返回 partial、warnings、failedObjectTypes 和可重试信息；基础表列表失败时阻断完整快照，扩展对象失败时保留已发现对象但显式标记不完整。"
    acceptance_criteria:
      - "任一类别失败时响应包含对象类别、错误摘要和 partial=true"
      - "前端对象树与 MCP 响应显示可读警告并提供重试"
      - "增加多类别失败、权限不足和方言不支持的回归测试"
    verification_status: 代码证据确认
    verification_path: "使用 fake DB 让触发器查询失败而表查询成功，调用 DBGetObjects，断言响应保留表对象但带 partial/warnings；基础 GetTables 失败时断言完整结果被阻断。"
    verification_boundary: "真实权限和 UI 流程尚未验证。"
    reproduction:
      preconditions: ["表查询成功、触发器查询失败的 fake DB"]
      steps: ["调用 DBGetObjects", "检查 Success、对象列表和警告"]
      expected: "保留可用对象并明确 partial/warnings。"
      actual: "返回 Success:true 且没有失败类别。"
    root_cause: "对象查询错误只记录日志或 continue，QueryResult 没有部分成功状态。"
    regression_risk: "前端侧栏、补全和 MCP 对返回结构的消费需要兼容新增警告字段。"
    fix_boundary:
      allowed_paths: ["internal/app/methods_db_objects.go", "connection.QueryResult 相关类型", "侧栏/MCP 测试"]
      preserve: ["权限足够时现有对象列表和排序", "Redis 专用对象路径"]
      out_of_scope: ["无关元数据 SQL 方言重写"]
    regression_tests: ["扩展对象失败 partial", "基础表失败阻断", "前端/MCP 警告展示"]
    verification_commands: ["go test ./internal/app -run 'DBGetObjects|ObjectMetadata' -count=1"]
    issue:
      title: "[开发][P1] 对象元数据失败被伪装成完整成功"
      labels: [bug, developer, metadata, ai-ready]
      operation: metadata
      data_state: test_fixture
      server_side_effect: none
      security_constraints: ["不输出真实对象数据或凭据"]

  - id: FIND-DEV-REDIS-CURSOR-001
    title: "Redis 对象扫描遇到非法或不前进游标时静默截断"
    type: 功能缺陷
    severity: P1
    confidence: 高
    affected_capabilities: [CAP-EXP-001, CAP-REDIS-A01, CAP-SYNC-A08]
    affected_symbols: ["internal/app.(*App).DBGetTables", "internal/app Redis cursor scan"]
    contract_boundary: "Redis cursor 扫描结束语义与 DBGetTables Success 状态"
    conclusion: "DBGetTables 的 Redis 扫描在 ParseUint 失败或游标不前进时直接 break，仍以 Success:true 返回已扫描的 key，没有 truncated/warning 标记。"
    evidence:
      - "internal/app/methods_db.go:2182-2210: Redis cursor 解析与推进异常直接结束循环"
      - "internal/app/methods_db.go:2211-2218: 已收集 key 直接包装为成功 QueryResult"
    impact: "大 keyspace、代理异常或服务端返回畸形游标时，对象树、全库查找和 Redis 同步选择器会漏项，后续操作可能基于不完整集合。"
    recommendation: "将非法/重复游标视为明确错误或 partial=true；返回扫描中断原因和已扫描数量，前端提供重试而不是伪装完整成功。"
    acceptance_criteria:
      - "非法或重复游标不会返回无告警成功"
      - "正常 cursor=0 结束路径保持成功"
      - "覆盖非法游标、重复游标、代理断开和超大 keyspace 测试"
    verification_status: 代码证据确认
    verification_path: "stub Redis ScanKeys 首次返回非数字 cursor 或恒定 cursor，调用 DBGetTables，断言响应标记截断并可展示原因。"
    verification_boundary: "真实 Redis 集群和代理行为尚未验证。"
    reproduction:
      preconditions: ["返回非法或重复 cursor 的 Redis fake"]
      steps: ["调用 DBGetTables", "观察 key 数量、Success 和截断状态"]
      expected: "非法/重复 cursor 标记 partial/truncated 或返回错误。"
      actual: "循环 break 后仍返回 Success:true。"
    root_cause: "ParseUint 失败或 cursor 不推进时直接 break，未携带扫描状态。"
    regression_risk: "对象树、全库查找和 Redis 同步选择器依赖 DBGetTables 结果。"
    fix_boundary:
      allowed_paths: ["internal/app/methods_db.go", "Redis cursor 相关类型和测试"]
      preserve: ["cursor=0 正常完成", "已扫描 key 的返回能力"]
      out_of_scope: ["Redis 扫描算法整体重写"]
    regression_tests: ["非法 cursor", "重复 cursor", "正常 cursor=0"]
    verification_commands: ["go test ./internal/app -run 'DBGetTables.*Redis|Redis.*Cursor' -count=1"]
    issue:
      title: "[开发][P1] Redis 游标异常会静默截断对象列表"
      labels: [bug, developer, redis, ai-ready]
      operation: metadata
      data_state: test_fixture
      server_side_effect: read_only
      security_constraints: ["只使用 fake/只读 Redis，不输出 key 内容"]

  - id: FIND-DEV-SOURCEQUERY-PREVIEW-001
    title: "SourceQuery 多映射预览丢弃用户选择的 tableName"
    type: 功能缺陷
    severity: P1
    confidence: 高
    affected_capabilities: [CAP-SYNC-A03, CAP-SYNC-A04]
    affected_symbols: ["internal/app.(*App).DataSyncPreview", "internal/sync.(*SyncEngine).Preview", "internal/sync.previewSourceQuery"]
    contract_boundary: "DataSyncPreview 请求 tableName 与 source-query 预览解析表名"
    conclusion: "DataSyncPreview 接收 tableName，但 SyncEngine.Preview 在 hasSourceQuery 分支调用 previewSourceQuery(config, limit) 时没有传入该参数，预览改用 source-query context 推断的表名。"
    evidence:
      - "internal/app/methods_sync.go:221-245: DataSyncPreview 将 tableName 传入 engine.Preview"
      - "internal/sync/preview.go:49-57: source-query 分支丢弃 tableName"
      - "internal/sync/source_query_sync.go:339-367: 预览表名来自推断的 ctx.TableName"
    impact: "用户在多表映射中选择的表与预览差异、主键和统计可能不一致，批准前看到的结果不能代表实际同步目标，存在误同步风险。"
    recommendation: "source-query 预览显式传递并校验 tableName/映射 ID；不一致时返回可定位错误，并在结果中同时返回 requestedTable 与 resolvedTable。"
    acceptance_criteria:
      - "多映射 source-query 预览严格匹配请求的 tableName"
      - "映射不一致时阻止确认而非静默切换"
      - "增加 tableName 丢失和多映射回归测试"
    verification_status: 代码证据确认
    verification_path: "构造 sourceQuery 配置和两张映射表，调用 DataSyncPreview(config, 'table_b', 100)，断言结果表为 table_b；不匹配时断言返回明确错误。"
    verification_boundary: "真实双端同步尚未验证。"
    reproduction:
      preconditions: ["sourceQuery 配置包含两张映射表"]
      steps: ["选择 table_b", "调用 DataSyncPreview", "检查返回 Table"]
      expected: "预览严格针对 table_b。"
      actual: "预览使用 source-query context 推断表名。"
    root_cause: "Preview 的 source-query 分支没有传递 tableName。"
    regression_risk: "同步预览、批准和执行前检查共享该表名解析链路。"
    fix_boundary:
      allowed_paths: ["internal/sync/preview.go", "internal/sync/source_query_sync.go", "internal/app/methods_sync.go", "相关测试"]
      preserve: ["单映射 sourceQuery 行为", "非 sourceQuery 预览路径"]
      out_of_scope: ["无关同步引擎重构"]
    regression_tests: ["多映射 sourceQuery tableName", "不匹配时阻断"]
    verification_commands: ["go test ./internal/sync ./internal/app -run 'Preview|SourceQuery' -count=1"]
    issue:
      title: "[开发][P1] SourceQuery 预览可能使用错误映射表"
      labels: [bug, developer, sync, data-correctness, ai-ready]
      operation: sync
      data_state: test_fixture
      server_side_effect: none
      security_constraints: ["不连接生产源/目标库，不执行写同步"]

  - id: FIND-DEV-SQLITE-METADATA-NPLUS1-001
    title: "SQLite 对象树加载对每张表串行执行 COUNT(*)"
    type: 性能缺陷
    severity: P2
    confidence: 高
    affected_capabilities: [CAP-EXP-001, CAP-EXP-A13]
    affected_symbols: ["internal/db SQLite table stats", "internal/app.(*App).DBGetTables", "internal/db.(*SQLiteDB).GetTables"]
    contract_boundary: "SQLite 对象树首屏与逐表 COUNT 统计任务边界"
    conclusion: "SQLite 的表统计路径会为每张表单独执行 SELECT COUNT(*)，DBGetTables 在首屏加载阶段同步等待这些统计，表数量或表数据量增长时形成串行 N 次扫描。"
    evidence:
      - "internal/db/database.go:129-164: SQLite 表统计逐表执行 COUNT(*)"
      - "internal/app/methods_db.go:2229-2248: 统计失败仅 Warn，仍在同一对象加载流程中等待"
      - "internal/db/sqlite_impl.go:271-320: SQLite 表列表入口"
    impact: "大型 SQLite 项目打开连接或刷新对象树明显变慢，首屏被统计阻塞；统计失败也没有独立的 pending/error 状态。"
    recommendation: "首屏先返回表名，行数统计改为异步按需加载或近似值，并在结果中提供 statsPending/statsErrors。"
    acceptance_criteria:
      - "对象树首屏不被 N 次 COUNT 阻塞"
      - "统计失败可见且可单独重试"
      - "覆盖 100+ 表和大表的查询次数/耗时基准"
    verification_status: 代码证据确认
    verification_path: "构造包含 100 张表的临时 SQLite 库，统计对象树请求中的 COUNT 次数和首屏耗时；验证异步统计方案不改变表列表正确性。"
    verification_boundary: "真实大库基准尚未执行。"
    reproduction:
      preconditions: ["包含大量表的临时 SQLite 数据库"]
      steps: ["打开或刷新对象树", "统计 COUNT 请求数和首屏耗时"]
      expected: "表列表先返回，统计异步或有明确 pending 状态。"
      actual: "首屏同步等待逐表 COUNT。"
    root_cause: "SQLite 对每张表串行执行 SELECT COUNT(*)。"
    regression_risk: "对象树、表概览和行数显示可能共享统计结果。"
    fix_boundary:
      allowed_paths: ["internal/db/database.go", "internal/app/methods_db.go", "SQLite 统计测试"]
      preserve: ["表名列表正确性", "用户主动查看统计时的准确性"]
      out_of_scope: ["无关 SQLite 方言重写"]
    regression_tests: ["100+ 表查询次数/耗时基准", "统计失败状态可见"]
    verification_commands: ["go test ./internal/db ./internal/app -run 'SQLite|GetTables' -count=1"]
    issue:
      title: "[开发][P2] SQLite 对象树逐表 COUNT 阻塞大型项目首屏"
      labels: [performance, developer, sqlite, ai-ready]
      operation: metadata
      data_state: test_fixture
      server_side_effect: read_only
      security_constraints: ["只使用临时 SQLite，不读取业务数据"]

