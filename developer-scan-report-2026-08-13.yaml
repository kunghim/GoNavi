suggestions:
  - id: SUG-DEV-001
    title: "建立统一数据源能力契约与生成式检查"
    value: "把 query、metadata、transaction、pagination、cancel、schema sampling、streaming 等能力注册在 Go 侧单一契约中，生成 Wails/前端能力表和测试矩阵；CI 检查新增驱动是否显式声明边界，避免半条路径和不可执行入口。"
