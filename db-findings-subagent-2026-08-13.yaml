    evidence: ["internal/db/scan_rows.go:67-80", "internal/db/scan_rows.go:115-125"]
    impact: "查询、导出、同步和审计可能无提示地漏行。"
    recommendation: "首次扫描错误立即返回并包含行号/列上下文；普通、流式、多结果集行为一致。"
