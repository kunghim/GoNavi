  - id: FIND-DB-EXTERNAL-001
    title: "Elasticsearch 写别名解析忽略 is_write_index，可能写入错误物理索引"
    type: 数据安全缺陷
    severity: P1
    confidence: 高
    failure_mode: partial_failure
    operation: write
    data_state: write_in_progress
    server_side_effect: possible_partial_write
    conclusion: "resolveWriteIndex 对多索引 alias 按名称倒序选择最新索引，没有读取 alias metadata 的 is_write_index。"
    evidence: ["internal/db/elasticsearch_impl.go:931-977", "internal/db/elasticsearch_impl.go:990-1006"]
    impact: "ApplyChanges 的 bulk update/delete/index 可能落到错误物理索引，导致查询不一致或更新不可见。"
    recommendation: "读取 alias is_write_index；多索引无唯一 write index 时拒绝写入。"
    acceptance_criteria: ["唯一 write index 被选", "无/多个 write index 明确报错", "物理索引和 bulk _index 不回归"]
    verification_status: 代码证据确认
    verification_path: "httptest 模拟 rollover alias，断言 ApplyChanges 的 bulk _index。"
    related_findings: []
    issue_projection:
      title: "[DB][P1] 按 is_write_index 解析 Elasticsearch rollover 写别名"
      labels: [bug, database, elasticsearch, data-integrity, ai-ready]
      body_sections:
        summary: "多索引写别名按名称猜测目标，可能把变更写入错误物理索引。"
        affected_behavior: "Elasticsearch ApplyChanges 的 bulk update/delete/index。"
        reproduction: {preconditions: ["alias 指向历史索引和当前写索引"], steps: ["配置唯一 is_write_index", "执行 ApplyChanges", "检查 bulk _index"]}
        expected: "严格使用唯一 is_write_index=true 的索引。"
        actual: "按索引名称倒序选择，不读取 is_write_index。"
        root_cause: "resolveWriteIndex 只解析索引集合，没有解析 alias metadata。"
        affected_files: ["internal/db/elasticsearch_impl.go:931-977", "internal/db/elasticsearch_impl.go:990-1006"]
        fix_boundary: {allowed_paths: ["internal/db/elasticsearch_impl.go", "internal/db/elasticsearch_impl_test.go"], preserve: ["查询 alias 行为", "物理索引直写行为"], out_of_scope: ["重写 ES 客户端"]}
        acceptance_tests: ["唯一/缺失/冲突 write index", "物理索引", "bulk action 精确断言"]
        validation_commands: ["go test ./internal/db -count=1 -run 'TestElasticsearch.*(WriteIndex|ApplyChanges)'"]
        risk_and_rollback: "可能已有部分 bulk 写入；失败时必须返回可诊断结果，不自动重试到另一索引。"
        verification_boundary: "代码证据确认；真实 rollover alias 待验证。"
      operation: write
      data_state: write_in_progress
      server_side_effect: possible_partial_write
      security_constraints: ["不输出 Authorization 或文档原文", "写测试仅使用隔离服务并经批准"]

