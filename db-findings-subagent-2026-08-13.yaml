  - id: FIND-DB-TRANSACTION-001
    title: "事务提交失败后提前标记完成，无法回滚或处置未知提交结果"
    type: 事务一致性缺陷
    severity: P1
    confidence: 高
    failure_mode: partial_failure
    operation: transaction
    data_state: transaction_open
    server_side_effect: commit_outcome_unknown
    conclusion: "文本事务 finish 在执行 COMMIT/ROLLBACK 前设置 done=true；控制语句失败后 Rollback/Close 不再补偿。"
    evidence: ["internal/db/database.go:624-640", "internal/db/database.go:661-675", "internal/db/oracle_impl.go:343-351"]
    impact: "Oracle 等文本事务可能留下未知提交状态或污染连接池，调用方无法安全恢复。"
    recommendation: "区分 finalizing/completed/unknown，成功后再完成；失败时回滚或丢弃连接并明确未知结果。"
    acceptance_criteria: ["COMMIT 失败后 Rollback 实际执行或连接丢弃", "Close-after-failure 不无动作", "连接不带未决事务回池"]
    verification_status: 代码证据确认
    verification_path: "fake driver 注入 COMMIT 错误，验证 Rollback、Close、连接丢弃和并发终结。"
    related_findings: []
    issue_projection:
      title: "[DB][P1] 事务提交失败后无法回滚，可能遗留未知提交状态"
      labels: [bug, database, transaction, data-integrity, ai-ready]
      body_sections:
        summary: "COMMIT 失败后事务句柄被标记完成，后续无法安全恢复。"
        affected_behavior: "文本事务提交、回滚、关闭和连接池生命周期。"
        reproduction: {preconditions: ["fake transaction driver"], steps: ["开始事务", "让 COMMIT 返回错误", "调用 Rollback 和 Close", "检查控制语句与连接池"]}
        expected: "提交失败必须可回滚、重试或明确丢弃连接并报告未知结果。"
        actual: "done=true 后 Rollback/Close 跳过补偿。"
        root_cause: "finish 在控制 SQL 执行前修改终态。"
        affected_files: ["internal/db/database.go:624-675", "internal/db/oracle_impl.go:343-351"]
        fix_boundary: {allowed_paths: ["internal/db/database.go", "internal/db/*transaction*_test.go"], preserve: ["正常 Commit/Rollback 行为"], out_of_scope: ["重写所有驱动事务实现", "前端事务 UI"]}
        acceptance_tests: ["Commit 失败后可回滚或连接被丢弃", "错误标识 commit outcome unknown"]
        validation_commands: ["go test ./internal/db -count=1 -run 'TestSQLConnTransaction|TestOracleOpenTransaction'"]
        risk_and_rollback: "服务端提交结果可能未知，修复必须避免污染连接池。"
        verification_boundary: "代码证据确认；自动化验证待执行。"
      operation: transaction
      data_state: transaction_open
      server_side_effect: commit_outcome_unknown
      security_constraints: ["不记录事务 SQL 原文或参数", "不连接生产数据库", "未经批准不执行写操作"]

  - id: FIND-DB-RESOURCE-001
    title: "SQLite 和 DuckDB 跳过连接池限制，并发访问可能耗尽资源或放大锁冲突"
