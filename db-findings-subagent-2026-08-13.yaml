  - id: FIND-DB-METADATA-001
    title: "达梦元数据 SQL 未统一转义 schema 与表名字面量"
    type: 查询正确性缺陷
    severity: P1
    confidence: 高
    failure_mode: privilege_mismatch
    operation: metadata
    data_state: quoted_identifier
    server_side_effect: none
    conclusion: "Dameng GetTables、GetCreateStatement、GetTriggers 及部分 metadata builder 直接拼接用户可见 schema/table 名称；同一驱动只有部分路径转义单引号。"
    evidence: ["internal/db/dameng_impl.go:258-263", "internal/db/dameng_impl.go:381-385", "internal/db/dameng_metadata.go:108-148", "internal/db/dameng_metadata.go:247-249"]
    impact: "含单引号或特殊名称的对象元数据读取失败，受控输入还可能改变只读字典查询结构。"
    recommendation: "建立统一 Dameng metadata literal escape helper，所有元数据构造器一致使用。"
    acceptance_criteria: ["schema/table 单引号使用两个单引号", "五类元数据入口统一转义", "普通大小写行为不回归"]
    verification_status: 代码证据确认
    verification_path: "使用包含单引号和大小写的 metadata 名称，断言生成 SQL 和请求参数。"
    related_findings: [FIND-DB-DIALECT-001]
    issue_projection:
      title: "[DB][P1] 统一达梦元数据 SQL 字面量转义"
      labels: [bug, database, dameng, query-correctness, ai-ready]
      body_sections:
        summary: "达梦不同元数据入口对 schema/table 名称采用不一致的字面量转义。"
        affected_behavior: "Tables、CreateStatement、Columns、ForeignKeys、Triggers 元数据读取。"
        reproduction: {preconditions: ["隔离达梦测试服务或 SQL 构造单测"], steps: ["传入含单引号名称", "调用五类元数据入口", "检查生成 SQL"]}
        expected: "所有用户可控名称统一安全转义并正确匹配对象。"
        actual: "部分入口直接拼接名称，部分入口才 ReplaceAll 单引号。"
        root_cause: "Dameng 元数据构造器没有共享 literal escape helper。"
        affected_files: ["internal/db/dameng_impl.go:258-385", "internal/db/dameng_metadata.go:108-325"]
        fix_boundary: {allowed_paths: ["Dameng 元数据实现与测试"], preserve: ["用户 SQL 执行路径", "现有大小写规则"], out_of_scope: ["重写 Dameng 驱动"]}
        acceptance_tests: ["覆盖单引号、大小写和普通名称", "五类元数据 SQL 均使用统一 helper"]
        validation_commands: ["go test ./internal/db -count=1 -run 'Test.*Dameng.*(Metadata|Columns|Foreign|Trigger|Create)'"]
        risk_and_rollback: "只读字典查询；错误日志不得包含完整敏感对象值以外的业务数据。"
        verification_boundary: "代码证据确认；真实达梦实例待验证。"
      operation: metadata
      data_state: quoted_identifier
      server_side_effect: none
      security_constraints: ["禁止新增字符串拼接旁路", "不连接生产数据库"]

