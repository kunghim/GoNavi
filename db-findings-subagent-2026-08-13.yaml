    evidence: ["internal/db/sql_pool.go:26-49", "internal/db/sqlite_impl.go:28-49", "internal/db/duckdb_impl.go:54-78"]
    impact: "并发元数据、查询和导入会增加文件锁、SQLITE_BUSY、句柄和内存压力。"
    recommendation: "SQLite 默认有限连接数，DuckDB 设置保守上限并暴露 DBStats。"
    acceptance_criteria: ["并发请求 OpenConnections 不超过策略上限", "SQLite 写入锁冲突可控", "池配置有回归测试"]
    verification_status: 代码证据确认
