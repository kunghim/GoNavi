        - 正常完整摘要行为
        - RabbitMQ 返回明确错误的现有语义
      out_of_scope:
        - 无关元数据 SQL 改写
        - 真实外部数据源写入
    regression_risk: QueryResult 兼容性、SQL 补全、对象搜索、AI schema 上下文和 MCP 响应消费者。
    acceptance_criteria:
      - 任一对象字段读取失败时返回 partial 或明确错误
      - warning 包含受影响对象和脱敏错误摘要
      - 基础对象失败不伪装完整快照
      - 前端和 MCP 能显示不完整状态并保留可用字段
    regression_tests:
