      - internal/db.(*QdrantDB).GetAllColumns
      - internal/db.(*MilvusDB).GetAllColumns
      - internal/db.(*SQLiteDB).GetAllColumns
    contract_boundary: QueryEditor、对象搜索和 MCP 对字段摘要完整性的期望，与 Database.GetAllColumns
      跳过单对象失败并返回普通成功结果之间的边界。
    conclusion: 多个驱动在 GetAllColumns 中对单对象 GetColumns 错误继续处理，App.DBGetAllColumns
      随后固定返回 Success:true；QueryResult 已有 Partial 和 Warnings 字段，但该调用链没有使用它们。
    evidence:
      - internal/app/methods_db.go:3853-3869
      - internal/db/chroma_impl.go:272-292
      - internal/db/qdrant_impl.go:261-281
      - internal/db/milvus_impl.go:266-286
      - internal/db/sqlite_impl.go:725-743
      - internal/db/kafka_impl.go:353-371
    reproduction:
      preconditions:
        - 包含两个对象的 fake 数据库，其中一个对象的 GetColumns 返回错误
      steps:
        - 调用 DBGetAllColumns
        - 再让 QueryEditor、对象搜索或 MCP 消费返回结果
      expected:
        - 调用方收到失败或带对象名称和错误摘要的 partial warning
      actual:
        - 成功响应只包含可读取对象的字段，没有不完整状态
    root_cause: 驱动层把单对象读取错误作为 continue 处理，应用层没有把该语义映射到 QueryResult.Partial 或 Warnings。
    impact: 自动补全、全库搜索和 MCP schema 读取可能遗漏字段并据此生成错误 SQL，用户无法区分对象不存在和元数据读取失败。
