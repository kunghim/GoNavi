    contract_boundary: 对外 HTTP Server 在 header 读取完成后，对 JSON 请求体、完整读取、响应写入和空闲连接没有资源边界。
    conclusion: Web 和 MCP HTTP Server 仅设置 ReadHeaderTimeout；Web 登录、初始化和 invoke
      handler 直接从 r.Body 解码 JSON，未见 MaxBytesReader 或完整的读写空闲时限。Docker 默认监听
      0.0.0.0，认证和 loopback 约束不能限制已建立连接的资源占用。
    evidence:
      - internal/webserver/server.go:719-733
      - internal/webserver/auth_pages.go:101
      - internal/webserver/auth_pages.go:144
      - internal/webserver/auth_pages.go:194
