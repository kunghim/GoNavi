      expected:
        - 请求在固定大小和读时限内被拒绝，业务和数据库调用不执行
      actual:
        - header 后的请求体读取没有大小或完整读时限边界
    root_cause: ServerOptions 只配置 ReadHeaderTimeout，路由层未统一包装 MaxBytesReader 或 JSON
      body 读取策略。
    impact: 未认证请求可长期占用连接和 goroutine，认证用户也可使 invoke 分配巨大参数；在容器或显式远端部署下可导致工作台或 MCP 服务不可用。
    recommendation: 为 Web 和 MCP 路由配置 ReadTimeout、WriteTimeout、IdleTimeout，并对所有 JSON
      入口统一限制 body 大小和返回可识别的超限状态。
