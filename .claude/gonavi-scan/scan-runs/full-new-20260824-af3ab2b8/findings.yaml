      - go test ./internal/db -run 'GetAllColumns' -count=1
    verification_status: 代码证据确认
    verification_path: 本轮运行 app 和 db 包相关测试；新增 fake 驱动覆盖单对象失败后验证 App、前端和 MCP 的完整性状态。
