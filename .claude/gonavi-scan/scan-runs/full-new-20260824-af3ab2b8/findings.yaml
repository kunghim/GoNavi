  - id: FIND-DEV-WEB-HTTP-LIMIT-001
    title: Web 和 Streamable HTTP MCP 服务缺少请求体与完整连接时限
    status: 待修复
    type: 安全缺陷
    severity: P1
    confidence: 高
    affected_capabilities:
      - CAP-WEB-001
      - CAP-WEB-A02
      - CAP-MCP-A04
    affected_symbols:
