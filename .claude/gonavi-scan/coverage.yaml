      next_verification: 在存在已启用调度的环境打开调度视图，实测调度行是否可点击跳转、是否展示上次运行状态。
    - candidate_id: dev-local-001
      reason: 代理本地转发器仅应用退出回收为已证实的静态事实，但需确认设计意图（跨连接复用）与真实累积量级。
      next_verification: 配置两个不同远端的同代理连接各连接一次后断开，netstat 观察 127.0.0.1 监听端口数量是否不减；与维护者确认回收策略预期。
