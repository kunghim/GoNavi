  - id: SCN-MCP-CONFIG-INTERRUPTION
    task_target_id: TASK-MCP-CONFIG-ATOMIC
    title: 覆盖已有 MCP 配置时发生写入或替换故障
    preconditions:
      - 已有包含其他服务的合法客户端配置。
    actions:
      - 触发 MCP 安装。
      - 在写入、关闭和替换阶段分别注入失败。
      - 比较正式配置和临时文件。
    oracle: 任一失败均保留原配置，成功时完整替换且无临时文件残留。
    selection_reason: 直接覆盖正式配置的失败后果会让整个 MCP 客户端不可用。
    relevant_views:
      - product
  - id: SCN-DESKTOP-EXPORT-FAILURE
    task_target_id: TASK-DESKTOP-EXPORT-ATOMIC
    title: 覆盖已有导出文件时查询或编码失败
    preconditions:
      - 目标路径已有可识别内容。
    actions:
      - 启动覆盖导出。
      - 在查询、编码和写入阶段注入失败。
      - 比较目标文件和临时文件。
    oracle: 失败不改变旧目标，成功只呈现完整新文件。
    selection_reason: os.Create 在业务完成前截断目标，会把普通导出失败升级为已有文件丢失。
    relevant_views:
      - product
  - id: SCN-DRIVER-AGENT-TWO-REQUESTS
    task_target_id: TASK-DRIVER-AGENT-STREAM-SYNC
    title: 首个流消费失败后立即发起第二个请求
    preconditions:
      - 测试 Agent 可以连续写入两个请求的响应。
    actions:
      - 让首个流在行消费时失败。
      - 立即发送第二个请求。
      - 检查响应 ID、首帧和 transport 生命周期。
    oracle: 第二请求只读取自己的响应；无法恢复同步时客户端废弃旧 transport。
    selection_reason: 连续请求最直接暴露残留帧和 ID 未校验造成的协议失步。
    relevant_views:
      - db
  - id: SCN-SQLSERVER-SSH-AZURE-TLS
    task_target_id: TASK-SQLSERVER-SSH-TLS-IDENTITY
    title: 通过本地 SSH 端口访问 Azure 风格 SQL Server 域名
    preconditions:
      - 有本地转发夹具和测试证书。
    actions:
      - 配置 Azure 风格远端域名并启用 SSH。
      - 捕获最终拨号地址、encrypt 和证书主机名。
      - 验证主机名不匹配时失败。
    oracle: 拨号目标使用本地端口，TLS 和 Azure 判断保持远端域名。
    selection_reason: 该组合同时触发 Host 重写、Azure 默认值和证书身份三条路径。
    relevant_views:
      - db
  - id: SCN-DESKTOP-EXPORT-CANCEL
    task_target_id: TASK-DESKTOP-EXPORT-CANCEL
    title: 长导出运行中从工作台发起取消
    preconditions:
      - 桌面工作台启动可阻塞的长导出。
    actions:
      - 等待进入运行状态。
      - 查找并触发取消。
      - 检查 Context、任务状态和目标文件。
    oracle: 用户可以取消，后端停止且目标文件安全；当前实现没有该桌面动作。
    selection_reason: 运行中锁定但不能取消是用户可直接感知的任务生命周期缺口。
    relevant_views:
      - product
  - id: SCN-WEB-SQL-AUDIT-OVER-60S
    task_target_id: TASK-WEB-SQL-AUDIT-TIMEOUT
    title: 完整性校验超过 60 秒后断开并启动第二个重任务
    preconditions:
      - 审计存储夹具可阻塞超过 60 秒。
    actions:
      - 通过 Web 启动校验。
      - 等待超时或断开客户端。
      - 立即启动第二个重任务并观察 Context。
    oracle: 长任务响应策略明确；请求结束会取消扫描并释放唯一重任务槽。
    selection_reason: 超过 HTTP 写超时并紧接第二任务可同时验证响应、Context 和并发槽契约。
    relevant_views:
      - developer
