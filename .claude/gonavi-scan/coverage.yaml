    - candidate_id: db-local-002
      reason: 同 db-local-001，空白键名删除分支调用链不可达，更新路径已报错、删除路径静默跳过仅构成防御性不一致。
    - candidate_id: dev-local-002
      reason: 保活串行 tick 为设计取舍：keepAliveInterval 默认 240 分钟且单目标 30s 上限，多连接同时到期场景缺乏实际影响证据，不满足接受门槛。
    - candidate_id: dev-local-003
      reason: 观察项而非缺陷：Wails 绑定名称级双向一致，未发现断链。
