        candidate_kind: defect
        temporary_title: Kafka 部分读取后取消可能被报告为成功
        observed_behavior_or_goal: 读取到部分消息后取消应返回取消或显式 partial，而不是普通成功。
        impact: 自动超时和非桌面调用方可能把截断消息当完整成功结果。
        verification_path: 隔离 Kafka broker 对 group/direct 路径执行一条消息后取消。
        confidence: 中
        evidence_refs:
          - E-DB-KAFKA-CANCEL
        proven_facts:
          - group 路径把 context 取消与短读超时合并为 break
          - direct 路径进入读取时只设置一次 deadline
          - nil error 会被应用层映射为成功
        unproven_assumptions:
          - 隔离 broker 上取消发生在至少一条消息之后时确实返回 records,nil
          - API/CLI/Web/MCP 会向用户暴露该成功状态
        negative_checks:
