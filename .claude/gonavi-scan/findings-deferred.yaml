  - id: FIND-PM-SYNC-SCHEDULE-CONTROL-001
    title: 同步调度清单缺少集中启停、立即运行和最近错误入口
    status: 待修复
    type: 产品缺口
    severity: P2
    confidence: 高
    affected_capabilities:
      - CAP-SYNC-001
      - CAP-SYNC-A01
    conclusion: 调度清单仅显示启用标识、表达式、时区和下次运行时间，并提供刷新；已有任务保存和按任务启动的后端能力未在调度清单暴露为启停、立即运行或最近错误定位动作。
    evidence:
      - frontend/src/components/data-sync/DataSyncOperationalViews.tsx:258-288
      - frontend/src/components/data-sync/DataSyncWorkbenchShell.tsx:653-656
      - internal/app/methods_sync_jobs.go:105
      - internal/app/methods_sync_jobs.go:243
    impact: 周期性同步异常时，操作者必须绕回任务编辑或运行历史页面，难以在同一列表快速停止风险任务、触发补跑或定位最近失败，延长恢复时间。
    recommendation: 将调度清单扩展为操作控制台，显示最近运行结果和错误摘要，并提供有影响范围提示的启停、立即运行和详情跳转。
    target_task: 同步操作者需要在计划任务列表中集中控制周期任务并在失败后快速恢复。
    current_boundary: 运行历史页面已支持取消、恢复和重试，但调度清单自身是只读摘要，不应据此扩大为整个同步模块没有恢复能力。
    checked_surfaces:
      - frontend/src/components/data-sync/DataSyncOperationalViews.tsx
      - frontend/src/components/data-sync/DataSyncWorkbenchShell.tsx
      - frontend/src/components/data-sync/gateway.ts
      - internal/app/methods_sync_jobs.go
      - frontend/src/components/DataSyncWorkbench.tsx
    acceptance_criteria:
      - 调度清单显示每个任务最近结果开始结束时间和脱敏错误摘要
      - 用户可从清单启用停用和立即运行任务
      - 立即运行与停用前显示目标任务和影响范围
      - 操作后状态在清单和运行历史保持一致
      - 失败详情可跳转到对应运行记录并提供安全重试路径
    verification_status: 代码证据确认
    verification_path: 创建定时任务后进入调度清单，验证控制动作、最近错误、运行历史跳转及应用重启后的状态一致性。
    first_seen_commit: a4696ac9e29d013096bb28df54fbee35e20d050a
    affected_paths:
