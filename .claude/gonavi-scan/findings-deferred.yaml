  - id: FIND-PM-CONNECTION-BATCH-001
    title: 连接列表缺少批量健康检查与失败汇总
    status: 待修复
    type: 产品缺口
    severity: P3
    confidence: 高
    affected_capabilities:
      - CAP-CONN-001
      - CAP-CONN-A01
    conclusion: 已保存连接只能在连接编辑器内逐个测试，连接健康入口也只接收单个连接；连接分组和侧栏没有批量检测、状态汇总、取消或仅重试失败项的闭环。
    evidence:
      - frontend/src/components/ConnectionModal.tsx:1996-2123
      - frontend/src/components/ConnectionModal.tsx:3103-3118
      - internal/app/methods_db.go:117
    impact: 维护多个环境连接时，用户需要反复打开编辑器，无法集中定位不可用连接和复查失败原因，增加巡检和故障恢复成本。
    recommendation: 为已保存连接提供可取消的批量健康检查，汇总状态、耗时和脱敏错误摘要，并支持仅重试失败连接。
    target_task: 管理多套开发、测试和生产连接的用户需要集中巡检已保存连接，并快速处理失败项。
    current_boundary: 当前提供单连接表单测试和单连接健康页面，没有以连接列表或分组为范围的检查任务。
    checked_surfaces:
      - frontend/src/components/ConnectionModal.tsx
      - frontend/src/components/ConnectionHealthModal.tsx
      - frontend/src/components/Sidebar.tsx
      - frontend/src/components/sidebar/sidebarLegacyNodeMenu.tsx
      - internal/app/methods_db.go
      - internal/app/methods_saved_connections.go
    acceptance_criteria:
      - 用户可选择多个已保存连接启动检查并看到进行中和取消状态
      - 每个连接显示成功失败未知状态耗时和脱敏错误摘要
      - 失败项可单独重试且不重复运行已成功项
      - 不可用驱动和连接配置错误在执行前或结果中有可解释反馈
    verification_status: 代码证据确认
    verification_path: 保存至少十个连接并从侧栏分组和工具入口启动健康检查，验证汇总、取消、失败重试和错误脱敏。
    first_seen_commit: a4696ac9e29d013096bb28df54fbee35e20d050a
    affected_paths:
      - frontend/src/components/ConnectionModal.tsx
      - frontend/src/components/ConnectionHealthModal.tsx
