  - id: FIND-DEV-DRIVER-IPC-LIMIT-001
    title: Optional Driver Agent 的 JSON Lines 单帧没有字节上限
    status: 待修复
    type: 资源与生命周期缺陷
    severity: P2
    confidence: 高
    affected_capabilities: [CAP-CONN-001, CAP-DS-CUSTOM, CAP-DATA-001]
    affected_symbols: [internal/db.(*optionalDriverAgentClient).callLocked, internal/db.(*optionalDriverAgentClient).callStreamQueryLocked, cmd/optional-driver-agent.writeResponse]
    contract_boundary: 主进程与 Optional Driver Agent 的 JSON Lines IPC 在单帧读取和解码前缺少资源上限。
    conclusion: 主进程对普通和流式 stdout 响应使用 ReadBytes 换行读取，代理端对请求使用无上限的行读取并把完整响应序列化为单行；现有 64 行批处理、周期 GC 和 stderr 8 MiB 上限均不能约束单帧字节数。
    evidence: [internal/db/optional_driver_agent_impl.go:247-258, internal/db/optional_driver_agent_impl.go:299-312, internal/db/optional_driver_agent_impl.go:483-516, cmd/optional-driver-agent/main.go:639-650]
    reproduction:
      preconditions: [fake Driver Agent 或 pipe 能持续写入没有换行的超大 JSON 行]
      steps: [调用普通查询或流式查询并让 stdout 返回超过协议阈值的单帧]
      expected: [读取在阈值内拒绝响应，终止或隔离污染代理并返回可恢复错误]
      actual: [ReadBytes 持续增长缓冲区后才尝试 JSON 解码]
    root_cause: IPC 协议没有定义并实现请求、普通响应和流式 chunk 的最大字节数，读取 API 本身也不提供上限。
    impact: 异常代理或包含超大 LOB、JSON、向量的合法响应可使桌面主进程或代理进程耗尽内存并中断连接。
    recommendation: 为两端 JSON Lines reader 引入硬字节上限和一致错误；超限后关闭并重建代理传输，避免污染后续调用。
    fix_boundary:
      allowed_paths: [internal/db/optional_driver_agent_impl.go, cmd/optional-driver-agent/main.go, internal/db, cmd/optional-driver-agent]
      preserve: [已有取消时终止代理的语义, 正常查询和流式结果协议, stderr 诊断限制]
      out_of_scope: [更换 IPC 协议, 无关驱动方言重构]
    regression_risk: 可选驱动查询、元数据、导入、流式结果和代理重启行为。
    acceptance_criteria: [请求普通响应和流式 chunk 都有明确最大字节数, 超限返回可诊断错误且不执行无限缓冲, 超限代理不会被后续请求复用, 正常大结果可在约束内分块返回]
    regression_tests: [主进程读取超限无换行 stdout, 代理读取超限 stdin, 超限流式 chunk, 超限后代理重建]
