    recommendation: 提供以稳定连接 ID 为主、经校验唯一别名为辅的 DuckDB 数据源引用语法或受控函数，由后端解析密钥并绑定到固定物理会话；默认只读，明确扩展安装、连接生命周期、取消、错误脱敏和凭据轮换规则。不要把展示名称直接做文本替换或把完整 DSN 回填到编辑器。
