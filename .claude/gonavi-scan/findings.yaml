  - id: FIND-DEV-DBSEARCH-FAILURE-STATE-001
    title: 全库内容搜索将逐表查询失败误报为无匹配
    type: 可观测性缺陷
    severity: P2
    affected_capabilities:
      - CAP-EXP-A02
    affected_paths:
      - frontend/src/components/FindInDatabaseModal.tsx
      - frontend/src/components/FindInDatabaseModal.test.tsx
    affected_symbols:
      - FindInDatabaseModal.handleSearch
    conclusion: 逐表 DBQuery 返回 success:false 或抛异常均被忽略；全部失败时仍触发 no_matches，部分失败没有未检查表的范围。
    evidence:
      - frontend/src/components/FindInDatabaseModal.tsx:180-217
      - frontend/src/components/FindInDatabaseModal.tsx:116-143：元数据阶段已有失败/partial反馈反证
      - 主 agent 提取当前处理函数，分别注入失败返回、Promise reject、成功空结果，三者均只触发 no_matches。
    impact: 用户无法区分查无数据与权限不足/断连，可能基于不完整搜索结果作出错误判断。
    contract_boundary: DBQuery QueryResult.success / rejected Promise → 搜索完成状态
    root_cause: 逐表循环只处理成功且非空数据；空 catch 和 success:false 均无记录；终态仅看 searchResults.length。
    recommendation: 收集逐表失败及完成范围；保留继续搜索其他表，并区分全部失败、部分完成、取消和真正无匹配。
    reproduction:
      preconditions:
        - 模拟两张有文本列的表，元数据读取成功。
      steps:
        - 第一表 DBQuery 返回 success:false，第二表抛出错误。
        - 观察通知和结果面板。
        - 改为一表成功一表失败，观察完成范围。
      expected: 显示失败表/原因；部分完成保留成功结果并明确不完整。
      actual: 全部失败显示无匹配；混合结果缺少失败范围。
    fix_boundary:
      allowed_paths:
        - frontend/src/components/FindInDatabaseModal.tsx
        - frontend/src/components/FindInDatabaseModal.test.tsx
        - shared/i18n
      preserve:
        - 单表失败后仍搜索后续表
        - 成功表的结果可查看
      out_of_scope:
        - 更改驱动错误协议
        - 合并所有搜索错误为全局中断
    regression_risk: 新增完成状态应与取消并发及无文本列表兼容，不把跳过表误报失败。
    acceptance_criteria:
      - 失败返回和异常都显示错误范围
      - 全部查询失败不显示纯无匹配
      - 部分成功明确显示未完成表并保留成功数据
      - 真正成功空结果仍可显示无匹配
    regression_tests:
      - 返回失败/reject/成功空结果三类对照
      - 两表混合成功失败与取消终态
    verification_commands:
      - npm --prefix frontend test -- --run src/components/FindInDatabaseModal.test.tsx
    verification_path: 当前源码 handleSearch 注入失败返回及 reject 已确认相同错误通知；后续组件回归验证状态与错误摘要。
    verification_boundary: 只执行函数级mock及现有组件测试；未连接真实无权限数据库或运行桌面。
