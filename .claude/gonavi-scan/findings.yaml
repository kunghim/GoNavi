  - id: FIND-DB-IRIS-WRITE-OUTCOME-001
    title: IRIS ApplyChanges 不支持取消且提交失败不标记写入结果未知
    type: 事务一致性缺陷
    severity: P3
    confidence: 中
    affected_capabilities:
      - CAP-DS-CUSTOM
      - CAP-DATA-A12
    affected_paths:
      - internal/db/iris_impl.go
    affected_symbols:
      - IrisDB.ApplyChanges
    conclusion: IrisDB.ApplyChanges 使用 conn.Begin/tx.Exec 全程无 context，提交直接 return tx.Commit()，未走 commitWriteTransaction/MarkWriteOutcomeUnknown 契约；提交前连接中断被包装为普通错误，IsAmbiguousWriteResponse 分类信息经 fmt.Errorf("%v") 丢失。
    evidence:
      - internal/db/iris_impl.go:518-586
      - internal/db/write_outcome.go:36-103
      - internal/app/import_pipeline.go:615-618
      - .claude/gonavi-scan/scan-runs/full-new-20260913-e7e3eb74-1789320000/evidence/reachability-applychanges.md
    impact: IRIS 作为 BatchApplier 参与数据导入链路：导入取消无法传播到在途语句；提交结果未知时上层无法按 unknown-outcome 契约区分确定失败与结果未知，按重试策略重放可能重复写入或漏写。
    recommendation: ApplyChanges 改为接收 context 并接入 commitWriteTransaction/MarkWriteOutcomeUnknown 契约，错误包装使用 %w 保留 errors.Is 链。
    acceptance_criteria:
      - 提交返回 ErrBadConn 等未知结果错误时 IsWriteOutcomeUnknown 为 true
      - 导入取消能传播到 IRIS 在途执行
      - 单行断言与既有 requireSingleRowAffected 行为保持
    verification_path: 用可注入错误的 fake driver：Exec 成功后 Commit 返回 driver.ErrBadConn，断言 IsWriteOutcomeUnknown(err)==true；对照组 mysql_impl 同错误注入。
    verification_boundary: 未连接真实 IRIS 实例；结论基于静态契约比对与调用链复核，导入链路可达性已确认。
    source_views:
