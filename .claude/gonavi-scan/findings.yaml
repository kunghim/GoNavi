    target_task: 管理多套开发、测试和生产连接的用户需要集中巡检已保存连接，并快速处理失败项。
    current_boundary: 当前提供单连接表单测试和单连接健康页面，没有以连接列表或分组为范围的检查任务。
    checked_surfaces: [frontend/src/components/ConnectionModal.tsx, frontend/src/components/ConnectionHealthModal.tsx, frontend/src/components/Sidebar.tsx, frontend/src/components/sidebar/sidebarLegacyNodeMenu.tsx, internal/app/methods_db.go, internal/app/methods_saved_connections.go]
    acceptance_criteria: [用户可选择多个已保存连接启动检查并看到进行中和取消状态, 每个连接显示成功失败未知状态耗时和脱敏错误摘要, 失败项可单独重试且不重复运行已成功项, 不可用驱动和连接配置错误在执行前或结果中有可解释反馈]
