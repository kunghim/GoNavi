      ]
    fix_boundary:
      allowed_paths: [ internal/webserver/server.go, internal/webserver/*_test.go ]
      preserve: [ 现有鉴权、请求体/读写超时和正常请求响应 ]
      out_of_scope: [ 无关 App 资源实现重构、前端 Web UI 改动 ]
    regression_risk: 请求取消和强制关闭可能影响文件传输、SQL 审计导出和长查询调用，应覆盖这些 handler。
    acceptance_criteria:
