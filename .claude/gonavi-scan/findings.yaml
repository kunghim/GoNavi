  - id: FIND-DEV-WEB-SHUTDOWN-RACE-001
    title: Web Server 关闭超时后可能在活跃请求完成前销毁 App 资源
    status: 待修复
    type: 资源与生命周期缺陷
    severity: P1
    confidence: 高
    affected_capabilities: [ CAP-WEB-A01 ]
    affected_symbols:
      [
        internal/webserver.Server.Run,
        internal/webserver.Server.handleInvoke,
        internal/app.App.Shutdown
      ]
    contract_boundary: Web Server Shutdown 与 App.Shutdown 及请求级 App 调用的资源生命周期边界
    conclusion: Web Server 的 Shutdown 超时后 Run 立即返回并触发 defer App.Shutdown，而 HTTP
      Shutdown 不会中断活跃 handler，活跃请求可能继续访问已关闭资源。
    evidence:
      - internal/webserver/server.go:798-847
      - internal/webserver/server.go:998
      - internal/app/app.go:586-607
      - internal/httpserver/security.go:21-24
    reproduction:
      preconditions: [ 注入阻塞的 invoker.Invoke 请求 ]
      steps:
        [
          启动 Web Server，发起阻塞请求，取消 Run Context，等待 5 秒 Shutdown deadline，观察
            App.Shutdown 与请求完成顺序
        ]
      expected: 活跃请求被取消/强制终止或在 App.Shutdown 前完成，资源不会被并发销毁。
      actual: Run 在 Shutdown 超时后返回，defer 随即调用 App.Shutdown；阻塞 handler 仍可能执行。
    root_cause: http.Server.Shutdown 只等待有限时间且不取消活跃 handler，Run 未追踪或有界等待活跃请求便销毁 App
      及其数据库、隧道、审计等资源。
    impact: 部署停止期间慢查询、上传或无 Context 驱动请求可能失败、产生未知写入结果或触发关闭后的资源竞态。
    recommendation: 追踪活跃请求并将服务级取消传入 handler，在资源销毁前完成有界等待或执行明确强制终止。
    first_seen_commit: 04977a127798de85bc5339fdfbe49f7f116f0395
