  - id: FIND-DEV-WEB-HTTP-LIMIT-001
    title: Web 和 Streamable HTTP MCP 服务缺少请求体与完整连接时限
    status: 待修复
    type: 安全缺陷
    severity: P1
    confidence: 高
    affected_capabilities: [CAP-WEB-001, CAP-WEB-A02, CAP-MCP-A04]
    affected_symbols: [internal/webserver.(*Server).Run, internal/mcpserver.StartStreamableHTTPServer, internal/webserver.(*Server).handleInvoke, internal/webserver.(*Server).handleLogin]
    contract_boundary: 对外 HTTP Server 在 header 读取完成后，对 JSON 请求体、完整读取、响应写入和空闲连接没有资源边界。
    conclusion: Web 和 MCP HTTP Server 仅设置 ReadHeaderTimeout；Web 登录、初始化和 invoke handler 直接从 r.Body 解码 JSON，未见 MaxBytesReader 或完整的读写空闲时限。Docker 默认监听 0.0.0.0，认证和 loopback 约束不能限制已建立连接的资源占用。
    evidence: [internal/webserver/server.go:719-733, internal/webserver/auth_pages.go:101, internal/webserver/auth_pages.go:144, internal/webserver/auth_pages.go:194, internal/webserver/server.go:865, internal/mcpserver/run.go:184-188, Dockerfile.web-server]
    reproduction:
      preconditions: [启动 Web Server 或显式非 loopback 的 Streamable HTTP MCP 服务]
      steps: [对登录初始化 invoke 或 MCP handler 发送超过阈值或不结束的 JSON 请求体]
      expected: [请求在固定大小和读时限内被拒绝，业务和数据库调用不执行]
      actual: [header 后的请求体读取没有大小或完整读时限边界]
    root_cause: ServerOptions 只配置 ReadHeaderTimeout，路由层未统一包装 MaxBytesReader 或 JSON body 读取策略。
    impact: 未认证请求可长期占用连接和 goroutine，认证用户也可使 invoke 分配巨大参数；在容器或显式远端部署下可导致工作台或 MCP 服务不可用。
    recommendation: 为 Web 和 MCP 路由配置 ReadTimeout、WriteTimeout、IdleTimeout，并对所有 JSON 入口统一限制 body 大小和返回可识别的超限状态。
    fix_boundary:
      allowed_paths: [internal/webserver, internal/mcpserver, Dockerfile.web-server, internal/webserver, internal/mcpserver]
      preserve: [现有认证流程, 正常流式 SSE 和 MCP 会话语义, 桌面原生窗口桥行为]
      out_of_scope: [更换认证协议, 修改数据库权限模型]
    regression_risk: Web 登录初始化 invoke、MCP Streamable HTTP、SSE 长连接和反向代理兼容性。
    acceptance_criteria: [Web 登录初始化和 invoke 的 JSON body 均有统一上限, MCP HTTP 请求有等价上限, 超限或慢 body 在业务调用前得到可识别错误, Server 配置完整读写空闲时限且不破坏 SSE 和正常 MCP 会话, Docker 公开监听场景有回归测试]
    regression_tests: [Web 登录超限 body, Web invoke 慢 body, MCP 超限 body, 正常 SSE 与 MCP 会话, 认证前后均不进入业务调用]
