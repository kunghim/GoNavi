  - id: FIND-DEV-DETACHED-SSE-QUEUE-001
    title: 分离窗口定向 SSE 可靠队列没有硬上限
    status: 待修复
    type: 资源与生命周期缺陷
    severity: P2
    confidence: 高
    affected_capabilities: [CAP-OPS-001, CAP-OPS-A10]
    affected_symbols: [internal/webserver/server.go:client.enqueue, internal/webserver/server.go:EmitTo, internal/webserver/server.go:handleEvents]
    contract_boundary: 分离窗口可靠事件生产速度与 SSE socket 消费速度之间的背压边界。
    conclusion: 非可靠事件队列受限，但 EmitTo 固定写入可靠队列，慢速或挂起分离窗口可使队列持续增长。
    evidence: [internal/webserver/server.go:162-189, internal/webserver/server.go:337-356, internal/webserver/server.go:580-596, internal/webserver/server.go:953-974]
    reproduction:
      preconditions: 建立不读取响应的 SSE 分离窗口客户端
      steps: [持续向该客户端 EmitTo]
      expected: 达到上限后合并降级或断连
      actual: reliable 队列没有硬上限
    root_cause: enqueue 仅限制 non-reliable 队列，而 EmitTo 为分离窗口路径固定指定 reliable=true。
    impact: 单个慢速分离窗口可造成无界内存占用并影响主应用稳定性。
    recommendation: 为可靠队列定义硬上限、合并策略或断连策略，并记录丢失或降级状态。
    fix_boundary:
      allowed_paths: [internal/webserver/server.go, internal/webserver/*_test.go]
      preserve: [关键关闭和状态事件的投递语义]
      out_of_scope: [重设计 SSE 协议]
    regression_risk: 队列策略可能丢弃顺序敏感窗口事件。
    acceptance_criteria: [可靠队列存在可测试上限, 慢消费端触发明确合并降级或断连, 正常分离窗口重连和关闭事件不回归]
    regression_tests: [阻塞 SSE 消费并连续 EmitTo, 断言队列大小及触发策略]
    verification_commands: [go test ./internal/webserver -run 'Test.*(SSE|EmitTo|Queue)' -count=1]
