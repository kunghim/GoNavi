  - id: FIND-PM-DUCKDB-SAVED-SOURCE-ATTACH-001
    title: DuckDB 查询无法安全复用已保存数据源
    status: 待修复
    type: 产品缺口
    severity: P3
    confidence: 高
    affected_capabilities:
      - CAP-DS-DUCKDB
      - CAP-CONN-001
      - CAP-QUERY-002
    conclusion: GoNavi 能按稳定连接 ID 或唯一名称解析已保存连接并在后端取回密钥，DuckDB 驱动也能执行原生 SQL；但两者之间没有受控桥接，因此 mysql_scan 等跨库函数仍要求用户在 SQL 中自行填写主机、账号和密码。
    evidence:
      - internal/db/duckdb_impl.go:54-72
      - internal/db/duckdb_impl.go:103-145
      - internal/app/connection_secret_resolution.go:13-76
      - internal/app/headless.go:163-190
      - internal/app/methods_db.go:1942-1998
    impact: 集团多系统报表无法复用 GoNavi 已维护的数据源身份，凭据容易进入查询历史、AI 上下文、截图、导出或协作内容；连接密码轮换后 SQL 还需逐份修改。
    recommendation: 提供以稳定连接 ID 为主、经校验唯一别名为辅的 DuckDB 数据源引用语法或受控函数，由后端解析密钥并绑定到固定物理会话；默认只读，明确扩展安装、连接生命周期、取消、错误脱敏和凭据轮换规则。不要把展示名称直接做文本替换或把完整 DSN 回填到编辑器。
    acceptance_criteria:
      - SQL 可引用已保存的 MySQL 等受支持数据源而不出现账号、密码或完整 DSN
      - 引用以稳定连接 ID 为权威，名称重复、连接删除、密钥存储不可用和凭据轮换均有明确错误及恢复路径
      - 密钥只在后端受控边界解析，不进入 SQL 文本、历史、日志、AI 上下文或前端事件载荷
      - DuckDB 扩展加载、ATTACH/scan 注册和查询在同一固定物理会话内完成，并在取消、失败和标签关闭后清理
      - 默认只读且遵守连接只读、生产风险确认、审计和查询超时策略
      - 用受控 MySQL 测试库验证连接成功、联表、轮换、取消、脱敏与资源回收
