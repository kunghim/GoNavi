  - id: FIND-DB-CHANGE-PREVIEW-DIALECT-001
    title: 跨方言变更预览把字符串固定渲染为 MySQL 风格转义
    status: 待修复
    type: 查询正确性缺陷
    severity: P2
    confidence: 高
    affected_capabilities: [CAP-DATA-001, CAP-DATA-A07]
    failure_mode: PostgreSQL、Oracle、SQL Server 等目标的变更预览把单引号和反斜杠固定渲染为反斜杠转义字面量，预览 SQL 可能无法解析或表示不同值。
    operation: query
    data_state: test_fixture
    server_side_effect: none
    conclusion: GenerateChangePreviewWithTableQuoter 只按数据源选择标识符和表名引用器，值字面量始终经 formatLiteral 使用反斜杠转义；现有测试也把该格式视为通用预期。
    evidence: [internal/db/change_preview.go:95-141, internal/app/methods_file.go:4882-4892, internal/db/change_preview_test.go:92-110]
    impact: 用户在提交前审查或复制预览 SQL 时，带单引号或反斜杠的值可能在目标方言中失败或含义变化，降低变更预览的可信度。
    recommendation: 将值字面量格式化纳入方言预览器或使用每个方言的安全编码规则，并覆盖单引号、反斜杠和时间值。
    acceptance_criteria: [MySQL PostgreSQL Oracle 和 SQL Server 的预览分别使用其支持的字符串字面量规则, 带单引号和反斜杠的测试值在对应方言解析后保持原值, 参数化 ApplyChanges 的实际写入行为不变, 预览失败时不展示可执行成功假象]
    verification_status: 代码证据确认
    verification_path: 运行现有 change preview 测试确认当前基线；新增方言断言，并只在受控实例中解析预览 SQL而不执行写入。
    first_seen_commit: a4696ac9e29d013096bb28df54fbee35e20d050a
    affected_paths: [internal/db/change_preview.go, internal/db/change_preview_test.go, internal/app/methods_file.go]
    verification_details:
      mode: 只读验证
      instance_id: full-new-20260820-db-tests
      verified_at: 2026-08-20T15:26:36+08:00
      result: go test ./internal/db -run ChangePreview 通过，且源码确认通用 formatLiteral 使用反斜杠转义。
    review_history: [{checked_at: 2026-08-20, result: DB-CORRECTNESS 和 DB-DIALECT 静态调用链复核确认}]
    last_checked_result: 2026-08-20 代码证据确认跨方言预览字面量规则错误；现有测试仅确认基线可运行。
