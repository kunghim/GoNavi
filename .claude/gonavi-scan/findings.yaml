  - id: FIND-DEV-DBSEARCH-QUALIFIED-NAME-001
    title: 全库内容搜索把 Schema 限定表名引用为单个标识符
    type: 调用链/契约缺陷
    severity: P2
    affected_capabilities:
      - CAP-EXP-A02
      - CAP-DS-POSTGRES
    affected_paths:
      - frontend/src/components/FindInDatabaseModal.tsx
      - frontend/src/utils/sql.ts
      - internal/db/postgres_impl.go
    affected_symbols:
      - FindInDatabaseModal.handleSearch
      - quoteIdentPart
      - quoteQualifiedIdent
      - parsePostgresTableNames
    conclusion: PostgreSQL 元数据返回 public.users 后，全库内容搜索用 quoteIdentPart 生成 FROM "public.users"，改变了目标对象身份，无法查询 public schema 下的 users 表。
    evidence:
      - frontend/src/components/FindInDatabaseModal.tsx:176-181
      - frontend/src/utils/sql.ts:34-78
      - internal/db/postgres_impl.go:363-405
      - frontend/src/components/Sidebar.tsx:5165
      - 主 agent 提取当前 handleSearch 和实际 sql.ts 工具执行：生成 SELECT * FROM "public.users"；quoteQualifiedIdent 对照为 public.users。
    impact: 普通 Schema 表的全库内容查找失败；逐表错误显示问题会进一步掩盖该失败。
    contract_boundary: PostgresDB.GetTables 的限定对象名称 → 前端单段引用助手
    root_cause: GetTables→parsePostgresTableNames 输出 schema.table；handleSearch 未拆分限定名即传 quoteIdentPart；点号成为带引号单段标识符的一部分。
    recommendation: 使用既有 quoteQualifiedIdent 契约处理完整表名，保留列名按单段引用；不改变后端对象名称协议。
    reproduction:
      preconditions:
        - 模拟 GetTables 返回 public.users，字段元数据含同表 text 列 name。
      steps:
        - 打开数据库侧栏全库查找，输入 alice。
        - 捕获 DBQuery 的查询文本。
      expected: FROM 引用 public.users 的两个标识符。
      actual: 生成 FROM "public.users"，指向名称包含点号的单一对象。
    fix_boundary:
      allowed_paths:
        - frontend/src/components/FindInDatabaseModal.tsx
        - frontend/src/components/FindInDatabaseModal.test.tsx
      preserve:
        - 列名仍按单段引用
        - 包含点号或引号的合法对象名由现有 qualifiedName 契约解析
      out_of_scope:
        - 修改数据库元数据协议
        - 全仓 SQL helper 重构
        - 搜索 CAST 类型问题另待实库证据
    regression_risk: 需防止名称本身含点号与限定名混淆；MySQL 单段表名行为应保持。
    acceptance_criteria:
      - public.users 按段引用并能定位正确对象
      - 覆盖带空格、大小写和引号的限定表名
      - 合法单段含点表名不误拆
    regression_tests:
      - mock public.users 和对应列，检查 FROM 不是单段引用
      - 现有 qualifiedName 编码的含点/引号用例
    verification_commands:
      - npm --prefix frontend test -- --run src/components/FindInDatabaseModal.test.tsx
