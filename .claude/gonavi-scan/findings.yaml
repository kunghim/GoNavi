      - 密钥只在后端受控边界解析，不进入 SQL 文本、历史、日志、AI 上下文或前端事件载荷
      - DuckDB 扩展加载、ATTACH/scan 注册和查询在同一固定物理会话内完成，并在取消、失败和标签关闭后清理
