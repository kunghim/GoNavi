    conclusion: Driver Agent 客户端读取流式响应时没有校验响应 ID；当 JSON 解码、列设置或行消费中途失败时会直接返回，也没有排空本请求剩余帧或终止 transport，下一次串行请求可能把残留帧当作自己的响应。
