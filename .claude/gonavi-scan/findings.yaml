  - id: FIND-DB-VECTOR-SQL-LITERAL-001
    title: Chroma 和 Qdrant 将筛选字面量中的关键字误当成查询控制语法
    type: 查询正确性缺陷
    severity: P2
    affected_capabilities:
      - CAP-VECTOR-A02
      - CAP-VECTOR-A03
      - CAP-VECTOR-A04
    affected_paths: &a3
      - internal/db/chroma_impl.go
      - internal/db/qdrant_impl.go
      - internal/db/vector_sql_where.go
    conclusion: 简化 SELECT 的 COUNT 判断和 LIMIT/OFFSET 正则扫描整个 SQL，未排除字符串字面量。category = 'count(' 会把记录查询改成计数；category = 'LIMIT 1' LIMIT 20 会采用字符串内的 1。
    evidence:
      - internal/db/chroma_impl.go:907-935：parseChromaSQL
      - internal/db/qdrant_impl.go:841-873：parseQdrantSQL
      - internal/db/chroma_impl.go:148-165、internal/db/qdrant_impl.go:162-174：Count直接决定请求分支
      - internal/db/vector_sql_where.go:29-63：WHERE自身有独立引号边界，不能保护外层COUNT/LIMIT正则
    impact: 合法过滤值改变返回结果形状或截断记录数量，用户无法得到所要求的记录范围。
    recommendation: 在引号/注释感知的词法边界解析 SELECT 投影与外层分页，保留简单方言范围和 JSON 入口。
    acceptance_criteria: &a4
      - 非聚合 SELECT 的 'count(' 字面量不触发计数
      - 字面量含 LIMIT/OFFSET 时仍使用真实外层子句
      - 真实 COUNT 与分页行为保持
      - 转义引号、标识符和注释边界有回归
    verification_path: 新增解析器表驱动用例并用现有 HTTP mock 断言 get/scroll 与 count 分支、limit/offset 参数。
    verification_boundary: 本轮为代码证据确认；未运行Go测试和真实向量服务；不把此COUNT结论扩展到Milvus。
    failure_mode: 筛选值误改查询类型与分页参数
    operation: query
    data_state: test_fixture
    server_side_effect: read_only
    reproduction: &a2
      - 执行 SELECT * FROM products WHERE category = 'count('，检查 parsed.Count 和请求路径。
      - 执行 SELECT * FROM products WHERE category = 'LIMIT 1' LIMIT 20，检查 parsed.Limit。
    expected: 分别读取记录且Count=false；外层Limit=20。
    actual: Count=true而走计数；Limit=1。
    root_cause: WHERE转换独立正确处理字面量，但parseChromaSQL/parseQdrantSQL另外全串扫描COUNT和分页，错误字段进入QueryContext。
    fix_boundary: 仅简化SQL词法边界、对应解析器及HTTP参数测试；保留JSON查询和当前显式不支持语法；不引入完整SQL引擎。
