  - id: FIND-PM-CONNECTION-BATCH-001
    title: 连接列表缺少批量健康检查与失败汇总
    status: 待修复
    type: 产品缺口
    severity: P3
    confidence: 高
    affected_capabilities: [CAP-CONN-001, CAP-CONN-A01]
    conclusion: 已保存连接只能在连接编辑器内逐个测试，连接健康入口也只接收单个连接；连接分组和侧栏没有批量检测、状态汇总、取消或仅重试失败项的闭环。
    evidence: [frontend/src/components/ConnectionModal.tsx:1996-2123, frontend/src/components/ConnectionModal.tsx:3103-3118, internal/app/methods_db.go:117]
    impact: 维护多个环境连接时，用户需要反复打开编辑器，无法集中定位不可用连接和复查失败原因，增加巡检和故障恢复成本。
