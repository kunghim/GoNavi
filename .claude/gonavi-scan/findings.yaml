  - id: FIND-DEV-WEB-RPC-CONTEXT-001
    title: Web RPC 请求取消未传递到应用层耗时操作
    status: 待修复
    type: 调用链/契约缺陷
    severity: P2
    confidence: 高
    affected_capabilities: [CAP-WEB-001, CAP-MCP-001, CAP-SYNC-001]
    affected_symbols: [internal/webserver/server.go:handleInvoke, internal/webserver/server.go:invokeMethod, frontend/src/utils/runtime_bridge.go:invoke, internal/app/methods_sync_jobs.go]
    contract_boundary: HTTP 请求 Context 到反射调用、App 公开方法和前端取消信号的传播边界。
    conclusion: Web RPC 忽略 r.Context，反射调用不注入 Context，前端 fetch 也不能传入 AbortSignal，导致客户端断开不会取消下游工作。
    evidence: [internal/webserver/server.go:862-910, internal/webserver/server.go:396-443, frontend/src/utils/runtime_bridge.go:99-130, internal/app/methods_sync_jobs.go:15-516]
    reproduction:
      preconditions: 使用可阻塞的 App 测试方法和 httptest 服务
      steps: [发起 Web RPC, 在方法完成前取消客户端请求]
      expected: 下游收到取消并释放资源
      actual: 调用继续运行且方法边界使用 Background Context
    root_cause: handleInvoke 未把 r.Context 传给 invokeMethod；反射层没有 Context 参数注入；公开同步 API 又创建 Background Context。
    impact: 已断开的 Web 客户端仍可占用同步、导入和数据库资源，用户无法可靠取消长任务。
    recommendation: 扩展反射调用契约以注入请求 Context，公开 App 方法接收并传播它，前端 bridge 支持 AbortSignal。
    fix_boundary:
      allowed_paths: [internal/webserver/server.go, frontend/src/utils/runtime_bridge.go, internal/app/methods_sync_jobs.go, 对应测试]
      preserve: [Wails 桌面调用兼容性, 已有错误映射]
      out_of_scope: [改变同步业务语义或外部服务协议]
    regression_risk: 反射参数匹配和 Wails 非 Web 调用可能受影响。
    acceptance_criteria: [取消 HTTP 请求后阻塞下游方法收到 Context 取消, 前端 AbortSignal 返回可识别取消结果, 正常 Web 和 Wails 调用保持兼容]
    regression_tests: [httptest 取消请求断言下游 Context Done, Web RPC 正常调用和反射参数兼容测试]
    verification_commands: [go test ./internal/webserver ./internal/app -run 'Test.*(Invoke|Context|Cancel)' -count=1]
    verification_status: 代码证据确认
    verification_path: 构造阻塞方法并取消 httptest 客户端请求，断言下游退出。
    verification_boundary: 未在真实浏览器和长时外部同步任务中执行取消。
    verification_details: {mode: 只读验证, instance_id: 当前工作区静态代码, verified_at: 2026-08-28T07:10:05Z, result: 代码调用链已确认，未执行专门的取消回归测试。}
    first_seen_commit: 14d1fc5e01e66454e23521cb3bf3c1902ff09604
    affected_paths: [internal/webserver/server.go, frontend/src/utils/runtime_bridge.go, internal/app/methods_sync_jobs.go]
