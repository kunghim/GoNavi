  - id: FIND-PM-QUERY-PARAMETER-BINDING-001
    title: 查询编辑器缺少可复用的运行时绑定参数
    status: 待修复
    type: 产品缺口
    severity: P2
    confidence: 高
    affected_capabilities:
      - CAP-QUERY-002
      - CAP-QUERY-A07
      - CAP-QUERY-A10
    conclusion: 当前查询调用、驱动公共契约和已保存查询模型只传递 SQL 文本，没有参数定义或运行时参数值通道；FineReport 等带参 SQL 只能由用户手工替换或拼接字面量后执行。
    evidence:
      - internal/app/methods_db.go:1311-1349
      - internal/app/methods_db.go:1561-1587
      - internal/db/database.go:328-346
      - internal/connection/saved_query.go:3-17
      - internal/db/duckdb_impl.go:103-115
    impact: 重复报表查询需要反复修改 SQL，字符串、日期、NULL 和列表值容易产生转义或类型错误；把敏感值写入 SQL 还会扩大历史、日志和分享场景中的暴露面。
    recommendation: 在查询编辑器增加参数面板和运行前输入，保存参数名称、类型及可选默认值而不保存敏感运行值；由后端按驱动能力转换为绑定参数，并对不支持绑定的语法给出明确兼容边界。
    acceptance_criteria:
      - 支持命名参数或位置参数，并覆盖字符串、数值、布尔、日期时间、NULL 和可选列表值
      - 参数值通过驱动绑定或等价安全通道执行，不以普通字符串替换作为默认实现
      - 已保存查询可保存参数定义并在执行前校验缺失值，敏感值不进入查询历史、日志和导出
      - 单语句、选区执行和多语句执行的参数作用域有明确规则及回归测试
      - 对不支持参数绑定的驱动或语法显示可操作的限制说明
