    contract_boundary: configurable AI HTTP endpoint -> provider error handling -> UI/AI session error
    conclusion: OpenAI、OpenAI Responses、Anthropic 和 Gemini provider 在非 200 响应分支直接 io.ReadAll(resp.Body)，没有 LimitReader 或 Content-Length 上限；自定义兼容端点或被劫持的上游可返回无限/超大错误体，客户端会分配与响应等量内存。
    evidence: [internal/ai/provider/openai.go:693-704, internal/ai/provider/openai_responses.go:774-779, internal/ai/provider/anthropic.go:648-653, internal/ai/provider/gemini.go:336-341]
