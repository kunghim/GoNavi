  - id: FIND-PM-SYNC-SCHEDULE-CONTROL-001
    title: 同步调度清单缺少集中启停、立即运行和最近错误入口
    status: 待修复
    type: 产品缺口
    severity: P2
    confidence: 高
    affected_capabilities: [CAP-SYNC-001, CAP-SYNC-A01]
    conclusion: 调度清单仅显示启用标识、表达式、时区和下次运行时间，并提供刷新；已有任务保存和按任务启动的后端能力未在调度清单暴露为启停、立即运行或最近错误定位动作。
