  - id: FIND-DEV-DBSEARCH-CANCEL-001
    title: 全库内容搜索停止操作未取消在途数据库查询
    type: 调用链/契约缺陷
    severity: P2
    affected_capabilities:
      - CAP-EXP-A02
      - CAP-QUERY-A12
    affected_paths:
      - frontend/src/components/FindInDatabaseModal.tsx
      - internal/app/methods_db.go
      - frontend/wailsjs/go/app/App.js
    affected_symbols:
      - FindInDatabaseModal.handleCancel
      - FindInDatabaseModal.handleSearch
      - App.DBQueryWithCancel
      - App.CancelQuery
    conclusion: 搜索使用无调用方 query ID 的 DBQuery；停止只设置 cancelledRef，不会取消在途查询，busy 持续到请求返回，晚到结果仍写入面板。
    evidence:
      - frontend/src/components/FindInDatabaseModal.tsx:5,156-181,206,222-235
      - internal/app/methods_db.go:1326-1344
      - frontend/wailsjs/go/app/App.js:CancelQuery/DBQueryWithCancel
      - 主 agent 用 deferred Promise 执行当前 handleSearch：Stop 后 searching=true；释放请求后结果仍写入。
    impact: 大表文本扫描在用户停止后持续使用连接与服务器资源，停止状态与实际执行不一致。
    contract_boundary: 前端停止动作 → 运行查询ID/取消 API
    root_cause: 循环只在下一表开始前检查 cancelledRef；DBQuery 无调用方可取消ID；handleCancel 未调用 CancelQuery；当前 await 后直接处理结果。
    recommendation: 为每次搜索查询管理唯一ID并传递取消；抑制已取消运行的晚到结果，同时保留后端不可取消驱动的明确限制。
    reproduction:
      preconditions:
        - 有效表/字段元数据；DBQuery 使用延迟 Promise 或支持取消的耗时测试驱动。
      steps:
        - 开始搜索并等待逐表查询在途。
        - 点击停止。
        - 观察后端取消调用、busy与释放后的结果。
      expected: 停止传递到该运行查询，终态一致且不接收晚到数据。
      actual: 只有布尔标志更新；在途请求继续，返回后仍可更新结果。
    fix_boundary:
      allowed_paths:
        - frontend/src/components/FindInDatabaseModal.tsx
        - frontend/src/components/FindInDatabaseModal.test.tsx
      preserve:
        - 驱动不支持取消时的明确后端契约
        - 正常搜索与其他查询的隔离
      out_of_scope:
        - 重写驱动取消实现
        - 元数据批量取消另行评估
        - 更改全局查询历史策略
    regression_risk: 显式查询ID可能影响审计/历史来源；取消必须仅针对本轮搜索，不误取消其他编辑器。
    acceptance_criteria:
      - 停止调用对应query ID取消接口
      - 支持取消的查询在可判定边界内停止
      - 取消后的晚到响应不回写结果
      - 重复搜索使用独立ID并清理注册状态
    regression_tests:
      - deferred mock 验证CancelQuery ID及晚到结果抑制
      - 两次搜索不相互取消
      - 后端返回不可取消错误不伪报停止成功
    verification_commands:
      - npm --prefix frontend test -- --run src/components/FindInDatabaseModal.test.tsx
      - go test ./internal/app -run 'CancelQuery|DBQueryWithCancel' -count=1
    verification_path: 已执行提取函数的延迟请求/取消/晚到结果检查；修复后组件断言取消ID，再用受控慢查询验证。
    verification_boundary: 未执行Go取消测试或实库取消延迟；不是所有驱动都承诺可中断。
