      - App.Shutdown 不早于活跃 handler 结束或明确终止。
      - Shutdown 超时结果可诊断，正常请求仍保持原有行为。
    regression_tests: [ 阻塞 invoke handler 的关闭顺序测试, 超时后 App 资源只关闭一次测试 ]
    verification_commands:
