  - id: FIND-DEV-MCP-SHUTDOWN-WAIT-001
    title: Streamable HTTP MCP 停止时可能无限等待活跃请求并阻塞进程退出
    status: 待修复
    type: 资源与生命周期缺陷
    severity: P1
    confidence: 高
    affected_capabilities: [ CAP-MCP-A04 ]
    affected_symbols:
      [
        internal/mcpserver.startStreamableHTTPServer,
        internal/mcpserver.closeBackendAfterServerStops
      ]
    contract_boundary: 父生命周期 Context、HTTP Shutdown、活跃 MCP handler 与 Backend.Close 的停止顺序契约
    conclusion: MCP 服务在 Shutdown 超时后无界等待 activeRequests；若活跃 handler 不返回，服务句柄和后端关闭流程永远不会完成。
    evidence:
      - internal/mcpserver/run.go:186-192
      - internal/mcpserver/run.go:234-240
      - internal/mcpserver/run_test.go:65
    reproduction:
      preconditions: [ 注入一个永不返回的 Streamable HTTP handler ]
      steps:
        [
          启动 startStreamableHTTPServer，取消父 Context，等待 shutdownTimeout 超时，观察
            handle.Done 或关闭流程
        ]
      expected: 在定义的强制终止窗口内返回，释放 handler 关联资源并完成后端关闭。
      actual: http.Server.Shutdown 超时后仍执行 activeRequests.Wait，无界阻塞；handler 不返回时进程无法结束。
    root_cause: Shutdown 只停止新连接，不会取消仍在运行的 handler；取消父 Context 后代码直接对 activeRequests
      做无超时等待，阻断 handle.complete 和 Backend.Close。
    impact: SIGTERM、升级或容器编排停止可能永久卡住，后端连接和其他资源无法进入关闭流程。
    recommendation: 为活跃 handler 引入可取消请求 Context，并在优雅关闭超时后执行有界强制关闭；明确 Backend.Close 与
      handler 的资源顺序。
    first_seen_commit: 04977a127798de85bc5339fdfbe49f7f116f0395
    affected_paths: [ internal/mcpserver/run.go, internal/mcpserver/run_test.go ]
    fix_boundary:
      allowed_paths: [ internal/mcpserver/run.go, internal/mcpserver/run_test.go ]
      preserve: [ 正常请求处理、已有鉴权和 HTTP 超时、后端只在服务停止后关闭 ]
      out_of_scope: [ 无关 MCP 工具协议重构、数据库驱动实现改造 ]
    regression_risk: 强制关闭可能影响流式响应、会话恢复和正在执行的只读/写入工具，需区分可取消与不可取消操作。
    acceptance_criteria:
      - 活跃 handler 在父 Context 取消后收到取消信号或被明确强制终止。
      - Shutdown 在有阻塞 handler 时于有界窗口内完成，Backend.Close 恰好执行一次。
      - 正常请求和流式响应仍能在无取消时完整完成。
    regression_tests: [ 阻塞 handler 的 shutdown timeout 测试, 活跃请求取消后 Backend.Close 顺序与次数测试 ]
    verification_commands: [ go test ./internal/mcpserver -run 'Shutdown|ActiveHandler' -count=1 ]
    verification_status: 代码证据确认
    verification_path: 使用阻塞 fake handler 取消父 Context，断言句柄完成时间、handler 取消和 Backend.Close 调用次数。
    verification_boundary: 未执行测试，未做容器 SIGTERM 或真实 Driver Agent 验证。
    verification_details:
      mode: 只读验证
      instance_id: current-dev-code-review
      verified_at: 2026-09-02T04:00:00Z
      result: 已完成 MCP 停机调用链代码复核，未执行阻塞 handler 测试。
    review_history: []
    last_checked_result: 开发视角确认 Shutdown 超时后 activeRequests.Wait 无界等待。
    issue:
      title: '[开发][P1] Streamable HTTP MCP 停止时可能无限等待活跃请求'
      labels: [ bug, developer, mcp, lifecycle ]
