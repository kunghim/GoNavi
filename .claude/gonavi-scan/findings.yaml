  - id: FIND-PM-SQL-HISTORY-001
    title: 普通 SQL 执行历史不能从编辑器恢复
    status: 待修复
    type: 产品缺口
    severity: P2
    confidence: 高
    affected_capabilities: [CAP-QUERY-001, CAP-QUERY-A17, CAP-AUDIT-A01]
    conclusion: 查询历史存储只记录达到慢查询阈值的成功执行，编辑器入口也只打开慢查询面板；审计工作台提供独立详情，但不能按连接、数据库和执行状态恢复普通或失败 SQL 的可编辑上下文。
    evidence: [internal/app/methods_query_history.go:168-181, frontend/src/components/QueryEditor.tsx:10525, frontend/src/components/SlowQueryPanel.tsx, frontend/src/components/audit/SqlAuditWorkbench.tsx]
    impact: 高频查询或失败排错在关闭标签后只能依赖记忆、日志或手工复制审计内容，不能自然恢复原连接、数据库和 SQL 上下文继续工作。
    recommendation: 提供面向编辑器的执行历史，按连接、数据库、时间和状态检索，并在遵守审计脱敏策略前提下恢复可编辑 SQL 和连接上下文。
    target_task: 用户执行快速成功或失败 SQL 后，需要回溯并在原连接和数据库上下文中继续编辑或重试。
    current_boundary: 慢查询面板和 SQL 审计覆盖部分查看与筛选，不等价于普通执行历史和编辑器恢复工作流。
    checked_surfaces: [internal/app/methods_query_history.go, internal/app/query_history_store.go, frontend/src/components/QueryEditor.tsx, frontend/src/components/SlowQueryPanel.tsx, frontend/src/components/audit/SqlAuditWorkbench.tsx, internal/app/methods_sql_audit.go]
    acceptance_criteria: [快速成功和失败 SQL 可按连接数据库时间和状态检索, 记录明确标示完整性和脱敏范围, 用户可一键恢复为可编辑查询标签并绑定原连接和数据库, 删除连接后历史 SQL 仍可在无连接状态安全查看和重绑定, 审计策略禁止保留正文时界面明确说明不可恢复原因]
    verification_status: 代码证据确认
    verification_path: 在同一连接执行快速成功和失败 SQL 后关闭标签，从编辑器、慢查询和审计入口尝试按连接和状态找回并恢复上下文。
    first_seen_commit: a4696ac9e29d013096bb28df54fbee35e20d050a
    affected_paths: [internal/app/methods_query_history.go, frontend/src/components/QueryEditor.tsx, frontend/src/components/SlowQueryPanel.tsx, frontend/src/components/audit/SqlAuditWorkbench.tsx]
    verification_details:
      mode: 只读验证
      instance_id: full-new-20260820-static
      verified_at: 2026-08-20T15:26:36+08:00
      result: recordQueryExecution 在时长低于慢查询阈值时直接返回，编辑器分析菜单只提供慢查询入口。
    review_history: [{checked_at: 2026-08-20, result: 产品扫描已核对慢查询和审计两个相邻入口}]
