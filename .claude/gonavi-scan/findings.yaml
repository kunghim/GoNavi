    affected_capabilities: [ CAP-QUERY-A04, CAP-QUERY-A05 ]
    conclusion: 手输内联补全用文本最后一个分号识别当前语句，字符串或注释中的分号会截断前文已使用别名，导致同一语句再次生成冲突别名。
