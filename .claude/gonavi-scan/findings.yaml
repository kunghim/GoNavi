  - id: FIND-DB-METADATA-QUOTING-001
    title: 特殊对象名会让 MySQL、MariaDB 和 SQLite 元数据查询生成错误 SQL
    status: 待修复
    type: 查询正确性缺陷
    severity: P2
    confidence: 高
    affected_capabilities: [CAP-EXP-001, CAP-EXP-A06, CAP-DS-MYSQL, CAP-DS-MARIADB, CAP-DS-SQLITE]
    failure_mode: 索引、外键、触发器或 SQLite DDL 元数据查询直接拼接对象名，合法名称包含反引号或单引号时会生成错误 SQL或错误匹配条件。
    operation: metadata
    data_state: test_fixture
    server_side_effect: read_only
    conclusion: MySQL 和 MariaDB 的 GetIndexes、GetForeignKeys、GetTriggers 使用 fmt.Sprintf 直接插入数据库名或表名；SQLite 同类元数据路径直接插入单引号。相邻的 GetColumns 和 GetCreateStatement 已使用安全帮助函数，证明并非所有元数据路径都受影响。
    evidence: [internal/db/mysql_impl.go:1147-1226, internal/db/mariadb_impl.go:271-350, internal/db/sqlite_impl.go:401-566, internal/db/mysql_impl.go:1065-1093]
    impact: 包含特殊字符的合法对象在侧栏、结构查看和 MCP 元数据调用中可能显示为空、报错或查询到错误对象，影响对象浏览和自动补全可靠性。
    recommendation: 统一使用方言标识符引用器和参数化条件；为索引、外键、触发器和 SQLite DDL 路径补充特殊对象名回归测试。
    acceptance_criteria: [MySQL MariaDB 和 SQLite 对含单引号或反引号的合法对象返回正确元数据, 索引外键触发器和 SQLite DDL 路径不再直接拼接未转义名称, MCP 与桌面入口获得一致错误或完整结果, 普通对象元数据行为保持不变]
    verification_status: 代码证据确认
    verification_path: 用 fake SQL driver 断言生成语句，或在只读测试实例创建含引号对象后读取元数据；本轮只运行现有 DB 包测试。
    first_seen_commit: a4696ac9e29d013096bb28df54fbee35e20d050a
    affected_paths: [internal/db/mysql_impl.go, internal/db/mariadb_impl.go, internal/db/sqlite_impl.go]
    verification_details:
      mode: 只读验证
      instance_id: full-new-20260820-db-tests
      verified_at: 2026-08-20T15:26:36+08:00
      result: go test ./internal/db 的相关元数据筛选通过；源码复核确认受影响路径直接格式化对象名且缺少特殊名称用例。
    review_history: [{checked_at: 2026-08-20, result: DB-METADATA 与 DB-DIALECT 复核排除了已使用安全帮助函数的相邻路径}]
    last_checked_result: 2026-08-20 代码证据确认元数据对象名转义不一致；现有测试仅确认基线可运行。
    issue_projection:
      title: "[DB][P2] 特殊对象名会破坏 MySQL、MariaDB 和 SQLite 元数据读取"
      labels: [bug, database, metadata, dialect, ai-ready]
      body_sections:
        summary: 部分元数据 SQL 直接插入对象名，不能处理合法的引号字符。
        affected_behavior: 索引、外键、触发器和 SQLite DDL 元数据读取。
        reproduction: 创建名称含单引号或反引号的测试对象，再读取其索引、外键、触发器或 DDL。
