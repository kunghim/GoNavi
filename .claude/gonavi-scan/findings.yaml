  - id: FIND-DEV-WEB-SQL-AUDIT-TIMEOUT-001
    title: Web SQL 审计完整性校验超时后仍占用重任务槽
    status: 待修复
    type: 调用链/契约缺陷
    severity: P2
    confidence: 高
    affected_capabilities:
      - CAP-AUDIT-A03
      - CAP-WEB-001
    conclusion: 当 SQL 审计完整性校验超过 60 秒时，Web 响应可能受 HTTP 写超时影响；该方法虽被登记为长任务并清除局部写 deadline，但校验内部使用 context.Background()，客户端断开或响应失败后仍会继续扫描，并占用唯一重任务槽直至结束。
    evidence:
      - internal/httpserver/security.go:20-25
      - internal/rpctimeout/methods.go:9-36
      - internal/webserver/long_running_invoke.go:10-15
      - internal/webserver/server.go:1089-1155
      - internal/app/methods_sql_audit.go:929-939
      - internal/sqlaudit/store.go:540-598
    impact: 大型审计库校验时，用户可能先看到 Web 请求失败，但后台工作继续占用唯一重任务配额，随后导出或再次校验被拒绝或长时间等待。
    recommendation: 让 Web 请求 Context 贯穿 App 与 sqlaudit 校验循环，并明确长任务写超时策略；客户端断开或超时后释放重任务槽并返回可区分的取消状态。
    acceptance_criteria:
      - 超过 60 秒的受控完整性校验不会因普通 HTTP WriteTimeout 丢失响应
      - 客户端取消、断开或服务端超时会停止数据库扫描并及时释放唯一重任务槽
      - 校验完成、取消、超时和完整性失败返回可区分状态
      - 取消一个校验后可以立即启动下一项允许的重任务
    affected_paths:
      - internal/httpserver/security.go
      - internal/rpctimeout/methods.go
      - internal/webserver/long_running_invoke.go
      - internal/webserver/server.go
      - internal/app/methods_sql_audit.go
      - internal/sqlaudit/store.go
    verification_path: 用可阻塞的审计存储夹具模拟超过 60 秒及请求取消，验证响应 deadline、Context 传播和重任务槽释放。
    last_checked_result: 本轮新发现：Web SQL 审计校验的超时、取消和重任务槽生命周期断裂。
    source_views:
      - developer
    affected_symbols:
      - httpserverlimits.WriteTimeout
      - rpctimeout.IsLongRunningAppMethod
      - clearLongRunningInvokeWriteDeadline
      - webserver.(*Server).handleInvoke
      - app.(*App).VerifySQLAuditIntegrity
      - sqlaudit.(*Store).VerifyIntegrity
    contract_boundary: Web 请求生命周期、长任务并发槽与 SQL 审计存储扫描 Context 之间的取消和超时契约
    reproduction:
      preconditions:
        - 使用可阻塞或包含足够事件的测试审计存储，使完整性校验持续超过 60 秒。
      steps:
        - 通过 Web invoke 启动 VerifySQLAuditIntegrity。
        - 等待超过写超时或主动断开客户端。
        - 立即发起第二个受重任务槽限制的操作并观察后台校验。
      expected: 长任务响应使用明确的 deadline 策略；请求结束后校验停止且重任务槽释放。
      actual: 校验使用 background Context，Web 响应失败或客户端离开后后台扫描仍可能继续占槽。
    root_cause: Web handler 识别长任务并尝试清除 ResponseController 写 deadline，但 App 方法没有接收请求 Context，sqlaudit.Store 又以 context.Background() 查询和遍历；请求取消无法传到存储层，defer 释放的重任务槽只能等同步调用结束。
    fix_boundary:
      allowed_paths:
        - internal/webserver/server.go
        - internal/webserver/long_running_invoke.go
        - internal/app/methods_sql_audit.go
        - internal/sqlaudit/store.go
        - internal/webserver/*test.go
        - internal/app/methods_sql_audit_test.go
        - internal/sqlaudit/store_test.go
      preserve:
        - 桌面 Wails 的现有无参数方法兼容入口
        - SQL 审计哈希校验语义
        - 单一重任务并发保护
      out_of_scope:
        - SQL 审计格式迁移
        - 无关 Web RPC 方法重构
    regression_risk: VerifySQLAuditIntegrity 同时服务桌面和 Web；增加 Context 入口时需避免改变桌面绑定签名，并防止并发槽被提前释放而后台仍运行。
    regression_tests:
      - 阻塞存储收到请求取消并退出。
      - 超过 60 秒的长任务写 deadline 行为。
      - 取消后第二个重任务能够获取槽。
      - 正常完整性校验结果保持不变。
    verification_commands:
      - go test ./internal/webserver -run 'LongRunning|SQLAudit|Invoke' -count=1
      - go test ./internal/app -run 'SQLAudit.*Integrity' -count=1
      - go test ./internal/sqlaudit -run 'Integrity|Cancel' -count=1
    verification_boundary: 未运行超过 60 秒的 Web 校验复现，也未在真实大型审计库上测量取消时延；当前结论来自调用链和 Context 代码证据。
