    affected_paths: [frontend/src/store.ts, frontend/src/components/Sidebar.tsx, frontend/src/components/sidebar/SidebarExternalSqlWorkflow.tsx, frontend/src/utils/externalSqlTree.ts, internal/app/methods_file.go]
