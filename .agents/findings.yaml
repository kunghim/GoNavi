  - id: FIND-SSH-HOSTKEY-001
    title: SSH 隧道无条件信任服务端主机密钥
    status: 待修复
    type: 安全缺陷
    severity: P1
    confidence: 高
    affected_capabilities: [CAP-CONN-002, CAP-CONN-A08]
    conclusion: 所有数据库 SSH 隧道均使用 ssh.InsecureIgnoreHostKey，没有 known_hosts 校验、指纹固定或首次连接确认，认证只验证客户端凭据而不验证跳板机身份。
    evidence: [internal/ssh/ssh.go:90-98]
    impact: 在 DNS、路由、代理或网络被劫持时，攻击者可冒充 SSH 跳板机并承接数据库流量；用户界面也没有呈现该风险或提供可信指纹配置。
    recommendation: 支持 known_hosts 和显式 SHA256 指纹固定；首次连接显示可核对指纹并经用户确认后持久化，密钥变化必须阻断且给出清晰恢复流程。
    acceptance_criteria: [未知主机密钥默认阻断或要求明确首次确认, 已固定指纹匹配时连接成功, 指纹变化时连接失败且不自动覆盖, 支持 known_hosts 哈希主机与非默认端口, 所有复用 SSH 隧道的数据源走同一校验路径]
    first_seen_commit: 8c111ab02764c453fc95362a2a4004c326cff447
    affected_paths: [internal/ssh/ssh.go, frontend/src/components/connectionModal/ConnectionModalNetworkSecuritySection.tsx]
    verification_status: 代码证据确认
    verification_path: 使用测试 SSH 服务轮换主机密钥，分别验证首次连接、固定指纹匹配与指纹变化阻断
