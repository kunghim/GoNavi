  - id: FIND-JVM-FIXTURE-001
    title: JVM 集成测试会混用不兼容的 java 与 javac
    status: 待修复
    type: 测试基础设施 / 环境兼容缺陷
    severity: P2
    confidence: 高
    affected_capabilities: [CAP-JVM-A01]
    conclusion: HTTP 和 JMX 真实 fixture 分别从 PATH 独立查找 java 与 javac；本机组合为 Java 8 和 javac 17 时，编译产物无法启动，readiness 只报告 EOF 并吞掉实际 JVM 错误。
    evidence: [internal/jvm/http_provider_test.go:512-565, internal/jvm/jmx_provider_test.go:766-829]
    impact: JVM Provider 的真实 round-trip 回归测试在常见多 JDK 环境中稳定失败，掩盖实际产品回归并增加故障定位成本。
    recommendation: 用共享 helper 解析同一 JDK 的 java/javac，优先 JAVA_HOME 或 javac 同目录 sibling java；启动前校验 major version，并在 readiness 失败时回显 stderr 和退出状态。
    acceptance_criteria: [PATH 中 java8 在前且 javac17 在后时选择一致工具链或给出明确前置条件错误, HTTP 和 JMX round-trip 均通过, fixture 启动失败包含 stderr 与版本信息, HTTP JMX Agent 共用工具链解析逻辑]
