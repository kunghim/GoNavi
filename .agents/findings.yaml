  - id: FIND-SYNCJOB-001
    title: 同步任务终态与终态事件非原子写入
    status: 待修复
    type: 可靠性 / 可观测性缺陷
    severity: P2
    confidence: 高
    affected_capabilities: [CAP-SYNC-A09]
    conclusion: syncjob 先提交运行终态，再单独追加终态事件且忽略追加错误；读取者可能看到 succeeded 却只有 queued、started，崩溃或写入失败时还可能永久缺少完成事件。
    evidence: [internal/syncjob/manager.go:900-906, internal/syncjob/store.go:961-992, internal/syncjob/store.go:1626-1662, internal/syncjob/manager_test.go:71-88]
    impact: 任务历史可能显示已完成但时间线缺少完成反馈，审计流水与运行状态不一致，用户和运维人员难以判断真实结束状态。
    recommendation: 新增事务型 CompleteRunOwnedWithTerminalEvent，在同一 SQLite 事务内校验 ownership、更新终态、分配序号并插入终态事件；提交后再触发 hook，事件失败必须回滚。
    acceptance_criteria: [终态对读取者可见时对应终态事件已持久化, 终态事件写入失败不会留下无事件终态, success partial fail cancel interrupted 均有一致性测试, 重复运行 100 次稳定通过, event sequence 连续且 hook 仅在提交后触发]
    first_seen_commit: 02da747e287ffb2fe442731517c00343bc2bd8f6
    affected_paths: [internal/syncjob/manager.go, internal/syncjob/store.go, internal/syncjob/manager_test.go]
    verification_status: 自动化测试确认
    verification_path: go test ./internal/syncjob -run "^TestManagerQueuesRunsForTheSameJobWithoutOverlap$" -count=100 -timeout=10m
    verification_details:
      mode: 只读验证
      instance_id: upstream-dev-02da747e-temp-snapshot
      verified_at: 2026-08-09T20:18:00+08:00
      result: 退出码 1，多轮第二个运行只读取到 queued 和 started 两个事件。
      preconditions: 使用隔离 GOCACHE 在 upstream/dev 临时快照重复运行并发队列测试。
      steps: [连续排队同一任务的两个运行, 等待第二个运行状态成功, 立即读取第二个运行事件]
      expected: 状态成功时 queued、started、succeeded 三个事件均可见。
      actual: 多次只得到 queued、started；终态事件稍后才可能追加。
      output: event count = 2, want 3；-count=100 退出码 1。
      boundaries: 未人为制造 SQLite 插入失败或进程崩溃；当前竞态已高频复现。
