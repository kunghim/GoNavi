  - id: FIND-MSG-001
    title: 查看消息型数据源字段会实际读取样本消息
    status: 待修复
    type: 运维风险 / 产品交互缺口
    severity: P2
    confidence: 高
    affected_capabilities: [CAP-ROCKET-A06, CAP-MQTT-A05, CAP-KAFKA-A06, CAP-RABBIT-A05]
    conclusion: Kafka、MQTT、RocketMQ 和 RabbitMQ 的 GetColumns 会读取实际消息推断 Payload 字段；RabbitMQ 重入队后会产生 redelivered 标记。
    evidence: [internal/db/kafka_impl.go:330, internal/db/mqtt_impl.go:332, internal/db/rocketmq_impl.go:377, internal/db/rabbitmq_impl.go:383, internal/db/rabbitmq_impl.go:821-837]
    impact: 打开字段元数据也可能产生等待、Broker 读取或订阅活动、额外权限要求，以及消息重投递或顺序扰动风险。
    recommendation: 默认显示静态消息元字段；将 Payload 推断改为显式读取样本操作，并提供副作用说明、禁用、限时、样本量和缓存策略。
    acceptance_criteria: [纯元数据操作不读取实际消息, 读取样本需用户显式确认并说明副作用, 可配置样本量和超时, RabbitMQ 取样行为及 redelivered 影响可观测, 四类消息服务有回归覆盖]
    first_seen_commit: 0acc9bdbd0300679ccb632f8a649b62095136f56
    affected_paths: [internal/db/kafka_impl.go, internal/db/mqtt_impl.go, internal/db/rocketmq_impl.go, internal/db/rabbitmq_impl.go]
    verification_status: 受控验证确认
    verification_path: RabbitMQ Management API 等价请求已确认；其他消息服务待复查
    verification_details:
