  - id: FIND-EXTSQL-001
    title: 已绑定的外部 SQL 目录被系统删除后无法顺畅恢复
    status: 待修复
    type: 功能 Bug / 恢复性缺陷
    severity: P2
    confidence: 高
    affected_capabilities: [CAP-QUERY-A09]
    conclusion: 外部 SQL 目录配置只校验路径字符串；目录在文件管理器中被删除后，启动刷新仅警告并保留空节点，删除本地目录操作因 ENOENT 直接失败且不会清理绑定，用户必须识别并改用含义相近的移除目录操作。
    evidence: [frontend/src/store.ts:2195-2228, frontend/src/components/Sidebar.tsx:1495-1533, frontend/src/components/sidebar/SidebarExternalSqlWorkflow.tsx:999-1043, frontend/src/components/sidebar/SidebarExternalSqlWorkflow.tsx:1089-1098, internal/app/methods_file.go:602-617]
    impact: 应用启动持续出现目录读取错误，失效节点与正常空目录不可区分；同一路径存在多连接或数据库绑定时还可能残留配置，造成用户无法完成清理闭环。
    recommendation: 将缺失目录建模为结构化失效状态；删除缺失目录按幂等成功处理并同步清理绑定，提供重新定位或一键移除同路径全部绑定，同时保留权限错误和非空目录保护。
    acceptance_criteria: [启动时明确标记失效目录且不重复噪声提示, 可重新定位或移除同路径全部绑定, 删除缺失目录按已不存在幂等完成配置清理, 权限错误和非空目录仍阻止误删, 覆盖后端 ENOENT 与前端启动删除恢复链路测试]
