  - id: FIND-VECTOR-SQL-WHERE-001
    title: Chroma 和 Qdrant 简化 SQL 会静默忽略 WHERE 条件
    status: 待修复
    type: 查询正确性缺陷
    severity: P2
    confidence: 高
    affected_capabilities: [CAP-VECTOR-A02, CAP-DS-CHROMA, CAP-DS-QDRANT]
    conclusion: 两类向量数据源的简化 SQL 解析器会接受带 WHERE 的 SELECT，但只解析 FROM、LIMIT、OFFSET 等字段；Chroma 的 Where 保持 nil，Qdrant 直接向 scroll/count 传 nil filter，最终返回未过滤结果而不报错。
    evidence: [internal/db/chroma_impl.go:145-157, internal/db/chroma_impl.go:848-884, internal/db/qdrant_impl.go:160-168, internal/db/qdrant_impl.go:815-850]
    impact: 用户以为筛选条件已生效，实际可能读取、展示或导出更大范围的数据；COUNT 也可能给出错误总数，属于静默结果错误而非显式能力限制。
    recommendation: 要么完整解析受支持的 WHERE 子集并映射到 Chroma where/Qdrant filter，要么检测任何未支持子句并拒绝执行，引导用户使用 JSON 命令。
    acceptance_criteria: [所有被接受的 WHERE 条件实际下推并影响结果, 不支持的操作符或子句返回明确错误, COUNT 与 SELECT 使用相同过滤语义, 覆盖大小写引号LIMIT OFFSET和复合条件, 不得静默删除任何非空子句]
    first_seen_commit: 8c111ab02764c453fc95362a2a4004c326cff447
    affected_paths: [internal/db/chroma_impl.go, internal/db/qdrant_impl.go]
    verification_status: 代码证据确认
    verification_path: 对带 WHERE 的 Chroma/Qdrant SELECT 使用记录请求体的 HTTP 测试服务，断言过滤条件被下推或命令被拒绝
    verification_details:
      mode: 只读验证
      instance_id: current-dev-8c111ab0-code-review
      verified_at: 2026-08-11T23:04:00+08:00
      result: 两个解析器识别 SELECT 与 FROM 后直接返回成功，不解析 WHERE；执行链路向服务端传递空过滤条件。
      preconditions: 当前 dev 源码；无需外部写操作。
      steps: [检查两类简化 SQL parser, 追踪 QueryContext 到 get/scroll/count 参数, 核对未支持语句错误分支]
      expected: WHERE 生效或查询被明确拒绝。
      actual: 查询被接受但 WHERE 被静默丢弃。
      output: parseChromaSQL 与 parseQdrantSQL 均没有 WHERE 解析逻辑。
      boundaries: 本轮未连接真实向量服务，结论基于确定的参数传递链路。
