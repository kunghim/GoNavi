    status: 待修复
    type: 产品能力缺口
    severity: P2
    confidence: 高
    affected_capabilities: [CAP-SYNC-A03, CAP-DS-TDENGINE, CAP-DS-IOTDB]
    conclusion: TDengine 和 IoTDB 目标只接受 INSERT；变更集合含 UPDATE 或 DELETE 时会被拒绝，无法完成通用差异同步。
