  - id: FIND-AI-CODEBUDDY-001
    title: Windows 会把 WSL bash 误当作 CodeBuddy 所需的 Git Bash
    status: 待修复
    type: 跨平台功能 Bug / 测试基础设施缺陷
    severity: P2
    confidence: 高
    affected_capabilities: [CAP-AI-A01]
    conclusion: Windows 的 CodeBuddy 环境解析会优先接受 PATH 中的 bash.exe；当命中 System32 的 WSL launcher 时，生产 Provider 会把错误的 Bash 路径写入 CODEBUDDY_CODE_GIT_BASH_PATH，测试夹具还会把 Windows 临时脚本路径直接交给 WSL，导致 No such file or directory。
    evidence: [internal/ai/provider/codebuddy_cli.go:411-457, internal/ai/provider/claude_cli.go:740, internal/ai/provider/codebuddy_cli_test.go:268-286]
    impact: Windows 用户的 CodeBuddy CLI 配置可能引用错误 Bash；自动化测试也无法可靠覆盖真实 Provider 调用，且当前失败信息可能为空。
    recommendation: 优先从 git.exe 和 Git for Windows 标准安装位置解析 Git Bash，并拒绝 System32/WindowsApps 的 WSL launcher；若支持 WSL，必须识别 shell 类型并转换 Windows 路径，同时保留 stderr、stdout 和底层错误。
    acceptance_criteria: [默认存在 WSL bash 的 Windows 环境能选择真实 Git Bash 或正确转换 WSL 路径, CodeBuddy Provider 全组测试通过, 覆盖空格和中文临时目录, 执行失败返回非空且可定位的错误信息]
    first_seen_commit: 02da747e287ffb2fe442731517c00343bc2bd8f6
    affected_paths: [internal/ai/provider/codebuddy_cli.go, internal/ai/provider/claude_cli.go, internal/ai/provider/codebuddy_cli_test.go]
    verification_status: 自动化测试确认
    verification_path: go test ./internal/ai/provider -run "^TestCodeBuddyCLIProvider_ChatParsesJSONEventArray$" -count=1 -v
    verification_details:
      mode: 只读验证
      instance_id: windows-local-upstream-dev-02da747e
      verified_at: 2026-08-09T20:08:00+08:00
      result: 测试退出码 1；本机优先解析到 System32 的 WSL bash，Windows 临时脚本路径在 WSL 内不可访问。
      preconditions: Windows PATH 同时存在 WSL bash launcher 和 Git for Windows。
      steps: [运行 CodeBuddy CLI Provider 代表测试, 检查 Bash 解析结果与脚本参数]
      expected: 选择与脚本路径格式兼容的 Bash 并完成 JSON 响应解析。
      actual: 选择 WSL bash 后直接传入 Windows 路径，进程失败。
      output: CodeBuddy CLI execution failed；已知底层输出为 No such file or directory。
      boundaries: 代表测试已失败；本轮未使用真实 CodeBuddy 账号发送请求。
