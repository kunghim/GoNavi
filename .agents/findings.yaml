  - id: FIND-RUNTIME-SIGNAL-001
    title: Web 和 MCP 服务未接通信号取消且主程序吞掉特殊模式错误
    status: 待修复
    type: 可靠性 / 生命周期 / 运维可观测性缺陷
    severity: P2
    confidence: 高
    affected_capabilities: [CAP-WEB-001, CAP-WEB-A01, CAP-MCP-001, CAP-MCP-A04]
    conclusion: Web/MCP 入口使用 context.Background，SIGTERM 不会触发已实现的 graceful shutdown；主 gonavi 的特殊模式还只记录运行错误并返回 handled，main 随后以成功退出码结束。
    evidence: [main.go:101-103, main.go:235-248, cmd/gonavi-mcp-server/main.go:12-17, internal/webserver/server.go:726-743, internal/mcpserver/run.go:195-226, Dockerfile.web-server:64-65, Dockerfile.mcp-server]
    impact: 容器停止、滚动更新或服务编排终止时会跳过 HTTP drain、App/AI/backend 关闭和在途任务收尾；参数、监听或运行失败还可能被脚本与监管器误判为成功。
    recommendation: 两个服务入口统一使用 signal.NotifyContext 监听中断与 SIGTERM；runSpecialMode 返回 handled 与 error，特殊模式错误传播为非零退出，清理完成后再结束进程。
    acceptance_criteria: [Web/MCP 收到 SIGTERM 后进入 graceful shutdown 并等待在途请求或超时, App AI MCP backend 关闭钩子只执行一次, 参数解析端口绑定和运行期失败返回非零退出码, stdio EOF 与正常取消不误报为异常, 容器停止集成测试覆盖两个入口]
    first_seen_commit: 8c111ab02764c453fc95362a2a4004c326cff447
    affected_paths: [main.go, cmd/gonavi-mcp-server/main.go, internal/webserver/server.go, internal/mcpserver/run.go, Dockerfile.web-server, Dockerfile.mcp-server]
    verification_status: 代码证据确认
    verification_path: 以子进程启动 Web/MCP，分别发送 SIGTERM、占用监听端口和传入非法参数，检查 shutdown 钩子与退出码
