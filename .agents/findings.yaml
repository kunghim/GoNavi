      result: 见 actual 和 output 字段
      human_approval: 历史迁移未记录
      temporary_resources: 见 steps 字段
      cleanup_result: 见 actual 字段
      preconditions: RabbitMQ Management API 可用，使用临时自动删除队列和可辨识顺序消息。
      steps: [创建临时队列并发布三条测试消息, 连续发送 ack_requeue_true 取样请求, 观察 redelivered 字段, 删除临时队列]
      expected: 第二次取样返回同一批消息且 redelivered 为 true。
      actual: RabbitMQ 3.13.7 第一次三条均为 false，第二次三条均为 true；临时队列已删除。
