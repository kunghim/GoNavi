    severity: P2
    confidence: 高
    affected_capabilities: [CAP-SYNC-001]
    conclusion: 差异同步和差异预览只支持单列主键，复合主键表会被拒绝或跳过，无法完成新增、更新、删除差异闭环。
    evidence: [internal/sync/analyze.go:191, internal/sync/preview.go:103, internal/sync/source_query_sync.go:82, internal/sync/sync_engine.go:326, internal/sync/analyze_i18n_test.go:294, internal/sync/preview_i18n_test.go:188, internal/sync/source_query_sync_test.go:262]
