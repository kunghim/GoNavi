      verified_at: 2026-08-09T20:09:00+08:00
      result: 混合工具链时两项测试均以 readiness EOF 失败；把 JDK 17 bin 置于 PATH 首位后两项均通过。
      preconditions: Windows PATH 中 java 8 先于 JDK 17，javac 来自 JDK 17。
      steps: [在混合 PATH 运行两项测试, 将 JDK 17 bin 置于 PATH 首位后重跑]
      expected: fixture 选择一致工具链或明确拒绝不兼容组合。
